<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus — AI Assistant</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="/static/images.png">
<style>
/* ─── idino 컬러 팔레트 ─── */
:root {
  --bg-primary: #0b0b0c;
  --bg-secondary: #14171B;
  --bg-tertiary: #1d2128;
  --bg-input: #202225;
  --bg-message-user: #00479d;
  --bg-message-assistant: #1d2128;
  --bg-hover: #2b2e32;
  --text-primary: #f0f0f0;
  --text-secondary: #a1a1a1;
  --text-muted: #6c737d;
  --accent: #00479d;
  --accent-light: #0e70b4;
  --accent-hover: #005087;
  --border: #2b2e32;
  --border-light: #363a3f;
  --scrollbar: #41454b;
  --success: #209445;
  --error: #DA017F;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ─── 헤더 ─── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-logo { width: 28px; height: 28px; border-radius: 6px; }

.header-title { font-size: 15px; font-weight: 600; }

.header-subtitle { font-size: 12px; color: var(--text-muted); margin-left: 8px; }

.header-right { display: flex; align-items: center; gap: 12px; }

.header-btn {
  background: none;
  border: 1px solid var(--border-light);
  color: var(--text-secondary);
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.15s;
}

.header-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
  border-color: var(--text-muted);
}

.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--success); display: inline-block;
}
.status-dot.offline { background: var(--error); }

/* ─── 토큰 카운터 ─── */
.token-counter {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-muted);
  padding: 3px 8px;
  background: var(--bg-primary);
  border-radius: 4px;
  border: 1px solid var(--border);
}

.token-counter span { font-variant-numeric: tabular-nums; }

/* ─── 사이드바 ─── */
.layout { display: flex; flex: 1; overflow: hidden; position: relative; }

.sidebar {
  width: 260px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: transform 0.25s ease, opacity 0.25s ease;
  position: absolute;
  left: 0; top: 0; bottom: 0;
  z-index: 10;
  transform: translateX(0);
  opacity: 1;
}

.sidebar.collapsed {
  transform: translateX(-100%);
  opacity: 0;
  pointer-events: none;
}

.sidebar-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 8px;
}

.new-chat-btn {
  flex: 1;
  padding: 10px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: background 0.15s;
}
.new-chat-btn:hover { background: var(--accent-hover); }

.sidebar-close-btn {
  background: none;
  border: 1px solid var(--border-light);
  color: var(--text-secondary);
  width: 36px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  transition: all 0.15s;
}
.sidebar-close-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

.session-list { flex: 1; overflow-y: auto; padding: 8px; }

.session-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 2px;
  transition: background 0.1s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.session-item:hover { background: var(--bg-hover); }
.session-item.active { background: var(--bg-tertiary); color: var(--text-primary); }

/* 세션 항목의 제목 — 긴 텍스트는 말줄임 */
.session-title {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 세션 삭제 버튼 — 평소엔 숨기고 hover 시 노출 */
.session-delete-btn {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 4px;
  font-size: 14px;
  line-height: 1;
  opacity: 0;
  transition: opacity 0.1s, background 0.1s, color 0.1s;
}
.session-item:hover .session-delete-btn,
.session-item.active .session-delete-btn {
  opacity: 0.7;
}
.session-delete-btn:hover {
  opacity: 1 !important;
  background: rgba(220, 38, 38, 0.15);
  color: #ef4444;
}

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
}

/* ─── 메인 영역 ─── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.messages { flex: 1; overflow-y: auto; padding: 24px 0; }

.messages-inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ─── 환영 화면 ─── */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  text-align: center;
}

.welcome-logo {
  width: 56px; height: 56px;
  margin-bottom: 20px;
  opacity: 0.9;
  border-radius: 12px;
}

.welcome h2 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }

.welcome p {
  font-size: 14px;
  color: var(--text-secondary);
  max-width: 400px;
  line-height: 1.6;
}

/* ─── 메시지 버블 ─── */
.message { margin-bottom: 24px; animation: fadeIn 0.2s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.message-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.message-avatar {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}

.message-avatar.user { background: var(--bg-message-user); color: #fff; }
.message-avatar.assistant { background: var(--accent); color: #fff; }

.message-sender { font-size: 13px; font-weight: 600; }

.message-body {
  padding-left: 32px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-primary);
  word-wrap: break-word;
}

.message-body p { margin-bottom: 8px; }
.message-body p:last-child { margin-bottom: 0; }

.message-body pre {
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  overflow-x: auto;
  margin: 8px 0;
  font-size: 13px;
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
}

.message-body code {
  background: var(--bg-hover);
  padding: 2px 5px;
  border-radius: 4px;
  font-size: 13px;
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
}

.message-body pre code { background: none; padding: 0; }

/* ─── 스트리밍 커서 ─── */
.streaming-cursor::after {
  content: '';
  display: inline-block;
  width: 7px; height: 16px;
  background: var(--accent-light);
  margin-left: 2px;
  animation: blink 0.8s infinite;
  vertical-align: text-bottom;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* ─── 입력 영역 ─── */
.input-area {
  padding: 16px 20px 20px;
  flex-shrink: 0;
}

.input-container {
  max-width: 720px;
  margin: 0 auto;
  position: relative;
}

.input-box {
  display: flex;
  align-items: center;
  background: var(--bg-input);
  border: 1px solid var(--border-light);
  border-radius: 12px;
  padding: 8px 12px;
  gap: 8px;
  transition: border-color 0.15s;
}

.input-box:focus-within { border-color: var(--accent); }

/* 첨부 버튼 */
.attach-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: color 0.15s;
}
.attach-btn:hover { color: var(--text-primary); }
.attach-btn svg { width: 18px; height: 18px; }

.input-box textarea {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-size: 14px;
  font-family: inherit;
  resize: none;
  max-height: 150px;
  line-height: 21px;
  padding: 4px 0;
}

.input-box textarea::placeholder { color: var(--text-muted); }

.send-btn {
  background: var(--accent);
  border: none;
  color: #fff;
  width: 32px; height: 32px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s;
}
.send-btn:hover { background: var(--accent-hover); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.send-btn svg { width: 16px; height: 16px; }

.input-footer {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 8px;
}

/* 첨부파일 프리뷰 */
.attach-preview {
  display: none;
  padding: 6px 12px;
  margin-bottom: 4px;
}

.attach-preview.visible { display: flex; flex-wrap: wrap; gap: 6px; }

.attach-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  color: var(--text-secondary);
}

.attach-chip .remove {
  cursor: pointer;
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1;
}
.attach-chip .remove:hover { color: var(--error); }

/* 숨겨진 파일 입력 */
#fileInput { display: none; }

/* ─── 로딩 인디케이터 ─── */
.thinking {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-left: 32px;
  color: var(--text-muted);
  font-size: 13px;
  margin-bottom: 16px;
}

/* ─── Qwen thinking 블록 (Claude hmm... 스타일) ─── */
.model-thinking {
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
  padding: 6px 10px;
  margin-bottom: 8px;
  border-left: 2px solid var(--border);
  background: var(--bg-primary);
  border-radius: 0 4px 4px 0;
  opacity: 0.7;
  max-height: 60px;
  overflow: hidden;
  transition: max-height 0.3s;
  cursor: pointer;
}
.model-thinking:hover { max-height: 300px; opacity: 1; }
.model-thinking::before { content: "thinking... "; font-weight: 500; }

/* ─── 목록 (bullet point / 번호 목록 / 중첩) ─── */
.message-body ul, .message-body ol,
.canvas-body ul, .canvas-body ol { margin: 4px 0; padding-left: 22px; }
.message-body li, .canvas-body li { margin-bottom: 4px; line-height: 1.6; }
/* 중첩 목록 — 상위 항목 아래로 들여쓰기 시각화 */
.message-body ul ul, .message-body ul ol,
.message-body ol ul, .message-body ol ol,
.canvas-body ul ul, .canvas-body ul ol,
.canvas-body ol ul, .canvas-body ol ol { margin: 2px 0; }
.message-body ol, .canvas-body ol { list-style: decimal; }
.message-body ul, .canvas-body ul { list-style: disc; }

/* ─── 제목 (마크다운 #/##/### → h2/h3/h4) ─── */
.message-body h2, .canvas-body h2 { font-size: 19px; font-weight: 700; margin: 16px 0 8px; line-height: 1.3; }
.message-body h3, .canvas-body h3 { font-size: 16px; font-weight: 700; margin: 14px 0 6px; line-height: 1.3; }
.message-body h4, .canvas-body h4 { font-size: 14px; font-weight: 700; margin: 12px 0 6px; color: var(--text-secondary); }
.message-body h5, .canvas-body h5 { font-size: 13px; font-weight: 700; margin: 10px 0 4px; color: var(--text-secondary); }
.message-body h6, .canvas-body h6 { font-size: 12px; font-weight: 700; margin: 10px 0 4px; color: var(--text-muted); }
.message-body h2:first-child, .message-body h3:first-child, .message-body h4:first-child,
.canvas-body h2:first-child, .canvas-body h3:first-child, .canvas-body h4:first-child { margin-top: 0; }

.thinking-dots span {
  display: inline-block;
  width: 4px; height: 4px;
  background: var(--text-muted);
  border-radius: 50%;
  animation: dot-pulse 1.4s infinite;
}
.thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
.thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dot-pulse {
  0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1); }
}

/* ─── 활동 표시 (Claude 스타일: 지금 어떤 도구를 실행 중인지) ─── */
/* 스트리밍 메시지 안에 들어가는 "AI가 지금 무슨 일을 하는지" 영역.
   구성: (1) 완료 단계들의 muted 트레일 + (2) 진행 중 라이브 인디케이터.
   메시지 본문과 좌측 정렬을 맞추기 위해 padding-left 32px (아바타 폭 보정). */
.activity-area {
  padding-left: 32px;
  margin-bottom: 6px;
}
/* 턴이 끝난 뒤 최종 메시지에 남는 완료 트레일은 더 흐리게.
   (접힌 도구결과 블록 activity-results는 클릭해 펼쳐 읽는 대상이라 흐리게 하지 않는다) */
.activity-area.activity-final .activity-trail { opacity: 0.6; }

/* 계획 체크리스트 패널 (TodoWrite) — 활동영역 상단 고정. 스트림 종료 후에도 유지. */
.todo-panel {
  border: 1px solid var(--border, #333);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 8px;
  background: rgba(127, 127, 127, 0.06);
  font-size: 0.88em;
}
.todo-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.todo-title { font-weight: 600; opacity: 0.85; }
.todo-count { font-variant-numeric: tabular-nums; opacity: 0.6; font-size: 0.9em; }
.todo-list { display: flex; flex-direction: column; gap: 2px; }
.todo-item { display: flex; align-items: baseline; gap: 6px; line-height: 1.5; }
.todo-mark { width: 1em; flex: none; text-align: center; }
.todo-completed { opacity: 0.55; }
.todo-completed .todo-text { text-decoration: line-through; }
.todo-in_progress { font-weight: 600; }
.todo-active { opacity: 0.75; font-weight: 400; font-size: 0.9em; }

/* 완료 단계 트레일 — 작은 muted 목록 (여러 도구가 누적됨) */
.activity-trail {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.activity-trail:not(:empty) { margin-bottom: 6px; }

/* 완료된 한 단계, 예: "✓ 문서 생성 · DocumentExport" */
.activity-step {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.5;
}
.activity-step .activity-check {
  color: var(--success);
  flex-shrink: 0;
  font-weight: 700;
}
/* 반복 접기 카운트 배지 (예: "×10") — 숫자 정렬 고정 */
.activity-count {
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
  opacity: 0.9;
  margin-left: 2px;
}

/* 진행 중 라이브 인디케이터, 예: "🔧 문서 생성 중 · DocumentExport" + 스피너 */
.activity-live {
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
  padding: 2px 0;
}
.activity-live-text { display: inline-flex; align-items: center; gap: 6px; }

/* 도구명 — 코드 폰트로 살짝 구분, 흐리게 */
.activity-tool-name {
  color: var(--text-secondary);
  opacity: 0.8;
  font-family: 'Cascadia Code', 'Consolas', monospace;
  font-size: 11px;
}

/* CSS 스피너 — 외부 라이브러리 없이 회전 링 (에어갭 준수) */
.activity-spinner {
  width: 12px;
  height: 12px;
  border: 2px solid var(--border-light);
  border-top-color: var(--accent-light);
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
  animation: activity-spin 0.7s linear infinite;
}
@keyframes activity-spin { to { transform: rotate(360deg); } }

/* ─── 도구 / 서브에이전트 결과 — 접힌 상세 블록 (Claude 스타일) ─── */
/* tool_result 프레임이 오면 여기(activity-results)에 <details> 박스를 하나씩 쌓는다.
   기본은 "접힘" 상태로, 요약 한 줄만 보이고 클릭하면 전체 원문이 펼쳐진다.
   메인 답변 말풍선(streamingBody)과 분리돼 있어, 도구 원문이 답변에 섞이지 않는다. */
.activity-results {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.activity-results:not(:empty) { margin: 4px 0 6px; }

/* 접힌 결과 박스 — 옅은 회색 카드 */
.tool-result {
  border: 1px solid var(--border-light);
  border-radius: 8px;
  background: var(--bg-secondary);
  overflow: hidden;
  font-size: 12px;
}

/* 요약 줄(summary): "▸ scout: 문서 분석 · 3개 문단 요약" 형태. 클릭 시 펼침 토글. */
.tool-result > summary {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  cursor: pointer;
  list-style: none;                 /* 브라우저 기본 삼각형 마커 제거(직접 ▸ 사용) */
  color: var(--text-secondary);
  user-select: none;
}
.tool-result > summary::-webkit-details-marker { display: none; }  /* Safari/Chrome 기본 마커 제거 */
.tool-result > summary::marker { content: ''; }                    /* Firefox 기본 마커 제거 */
.tool-result > summary:hover { background: var(--bg-hover); }
/* 키보드 포커스 시 접근성용 외곽선 */
.tool-result > summary:focus-visible { outline: 2px solid var(--accent-light); outline-offset: -2px; }

/* ▸ 캐럿 — 펼치면 90도 회전해 ▾ 처럼 보이게 한다 */
.tool-result .tr-caret {
  flex-shrink: 0;
  color: var(--text-muted);
  display: inline-block;
  transition: transform 0.15s ease;
}
.tool-result[open] > summary .tr-caret { transform: rotate(90deg); }

<script>
// ─── API 키 자동 주입 (분리구조 데모: web_auth 유지한 채 브라우저서 바로 채팅) ───
// 왜: 이 UI 의 fetch 는 원래 Authorization 헤더를 안 보내서 web_auth 가 켜져 있으면
//     401 이 난다. 같은 오리진(/v1/..., /health 등) 요청에만 API 키를 자동으로 붙여
//     인증을 끄지 않고도 브라우저에서 바로 채팅되게 한다.
(function () {
  const _origFetch = window.fetch;
  const API_KEY = 'nexus-b200-test-key-001';  // config/tenants.yaml 의 default 테넌트 키
  window.fetch = function (input, init) {
    init = init || {};
    const url = (typeof input === 'string') ? input : (input && input.url) || '';
    if (url.startsWith('/')) {  // 외부 URL 로는 키가 새지 않도록 상대경로만
      const h = new Headers(init.headers || {});
      if (!h.has('Authorization')) h.set('Authorization', 'Bearer ' + API_KEY);
      init.headers = h;
    }
    return _origFetch(input, init);
  };
})();

// ─── 다운로드 링크 처리 ───
// /v1/download/ 링크는 web_auth 때문에 인증 헤더가 필요하다. 브라우저 기본 이동
// (<a> href)은 헤더를 안 실으므로 401 이 난다. 그래서 클릭을 가로채 fetch(위의
// 인증 자동주입 적용)로 blob 을 받아 파일로 저장한다. 인증을 켠 채 다운로드 가능.
document.addEventListener('click', async (e) => {
  const a = e.target.closest ? e.target.closest('a.dl-link') : null;
  if (!a) return;
  e.preventDefault();
  const href = a.getAttribute('href');
  try {
    const resp = await fetch(href);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const blob = await resp.blob();
    const objUrl = URL.createObjectURL(blob);
    const tmp = document.createElement('a');
    tmp.href = objUrl;
    tmp.download = decodeURIComponent(href.split('/').pop());
    document.body.appendChild(tmp);
    tmp.click();
    tmp.remove();
    URL.revokeObjectURL(objUrl);
  } catch (err) {
    alert('다운로드 실패: ' + err.message);
  }
});

// ─── 상태 ───
let sessions = [];
let currentSessionId = null;
let isStreaming = false;
let attachedFiles = [];
let totalInputTokens = 0;
let totalOutputTokens = 0;

// ─── 초기화 ───
window.addEventListener('DOMContentLoaded', () => {
  checkHealth();
  newSession();
  // Ch 16: 서버에 저장된 과거 세션을 사이드바에 머지
  loadServerSessions();
  // 사이드바 클릭 위임 — 인라인 onclick의 escape 취약성 제거 (v0.14.7)
  setupSessionListDelegation();
  // 문서 미리보기 캔버스 닫기 버튼 + Esc 키
  const canvasClose = document.getElementById('canvasClose');
  if (canvasClose) canvasClose.addEventListener('click', closeCanvas);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const panel = document.getElementById('canvasPanel');
      if (panel && panel.classList.contains('open')) closeCanvas();
    }
  });
  document.getElementById('userInput').focus();
});

// 사이드바 컨테이너에 단일 click 리스너를 붙여
// .session-item / .session-delete-btn 클릭을 위임 처리한다.
// 인라인 onclick + JSON.stringify + escapeHtml 이중 처리는 일부 환경에서
// 따옴표/특수문자가 깨질 수 있어, 데이터 속성(data-sid) 기반으로 단순화.
function setupSessionListDelegation() {
  const list = document.getElementById('sessionList');
  if (!list) return;
  list.addEventListener('click', (ev) => {
    const target = ev.target;
    // 삭제 버튼이 우선
    const delBtn = target.closest && target.closest('.session-delete-btn');
    if (delBtn) {
      const sid = delBtn.getAttribute('data-sid');
      console.log('[session] delete click sid=', sid);
      ev.stopPropagation();
      if (sid) deleteSession(sid, ev);
      return;
    }
    const item = target.closest && target.closest('.session-item');
    if (item) {
      const sid = item.getAttribute('data-sid');
      console.log('[session] switch click sid=', sid);
      if (sid) switchSession(sid);
    }
  });
}

// HTML 특수문자 이스케이프 (서버에서 받은 session_id/메시지를 innerHTML에 넣을 때 사용)
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// 세션 제목 후보 — 첫 user 메시지 30자 → 없으면 session_id 뒷부분
function deriveSessionTitle(session) {
  // 서버에서 title_hint를 받아온 경우 최우선 사용 (파일 한 번 더 읽지 않음)
  if (session.titleHint) {
    const t = String(session.titleHint).trim().replace(/\s+/g, ' ');
    return t.length > 30 ? t.slice(0, 30) + '…' : t;
  }
  // 메시지가 이미 로드됐다면 그중 첫 user 메시지를 쓴다
  const firstUser = (session.messages || []).find(m => m.role === 'user');
  if (firstUser && firstUser.content) {
    const t = String(firstUser.content).trim().replace(/\s+/g, ' ');
    return t.length > 30 ? t.slice(0, 30) + '…' : t;
  }
  // session-1776929625 같은 형태면 뒷자리만, UUID면 앞 8자
  const id = session.id || '';
  if (id.startsWith('session-')) return id.slice(0, 18);
  return id.length > 12 ? id.slice(0, 8) + '…' : id;
}

// ─── 세션 관리 ───
function newSession() {
  const id = 'session-' + Date.now();
  const session = { id, title: '새 대화', messages: [], source: 'local' };
  sessions.unshift(session);
  currentSessionId = id;
  renderSessionList();
  clearMessages();
  totalInputTokens = 0;
  totalOutputTokens = 0;
  updateTokenDisplay();
}

async function switchSession(id) {
  console.log('[session] switchSession called id=', id);
  currentSessionId = id;
  renderSessionList();
  let session = sessions.find(s => s.id === id);
  clearMessages();
  if (!session) {
    console.warn('[session] not in local list — creating shell');
    session = { id, title: id, messages: [], source: 'server' };
    sessions.push(session);
  }

  // 로컬 캐시가 비어 있으면 (source 종류와 무관하게) 무조건 서버에 시도.
  // 서버에 없으면 404 — 그땐 빈 화면으로 둔다 (새 대화처럼 동작).
  // v0.14.7: 이전엔 source==='server'일 때만 fetch했으나 race·source 누락 등에서
  // 안 되는 경우가 있었음. 단순화 — "비어 있으면 일단 서버에 물어본다".
  if (!session.messages || session.messages.length === 0) {
    try {
      const url = `/v1/sessions/${encodeURIComponent(id)}/messages`;
      console.log('[session] GET', url);
      const resp = await fetch(url);
      console.log('[session]   ← status', resp.status);
      if (resp.ok) {
        const data = await resp.json();
        const msgs = (data.messages || []).map(m => ({
          role: m.role, content: m.content,
        }));
        session.messages = msgs;
        session.title = deriveSessionTitle(session);
        renderSessionList();
        console.log('[session] loaded', msgs.length, 'messages from', data.source);
      } else if (resp.status === 404) {
        // 새 대화: 사용자에게 굳이 알리지 않는다 (빈 화면이면 충분)
        console.log('[session] 404 — empty session');
        return;
      } else {
        appendMessage('system', `세션 로드 실패 (HTTP ${resp.status})`, false);
        return;
      }
    } catch (err) {
      console.error('[session] fetch error', err);
      appendMessage('system', `세션 로드 오류: ${err && err.message}`, false);
      return;
    }
  }

  session.messages.forEach(m => appendMessage(m.role, m.content, false));
}

// 페이지 시작 시 서버 세션 목록을 사이드바에 머지한다.
// 클릭 시점까지 메시지는 로드하지 않음 — 사이드바는 가볍게 유지.
async function loadServerSessions() {
  try {
    const resp = await fetch('/v1/sessions');
    if (!resp.ok) return;
    const data = await resp.json();
    const items = data.sessions || [];
    const known = new Set(sessions.map(s => s.id));
    let added = 0;
    for (const it of items) {
      const sid = it.session_id;
      if (!sid || known.has(sid)) continue;
      const item = {
        id: sid,
        titleHint: it.title_hint || null,   // 서버가 계산해준 첫 user 메시지 요약
        messages: [],                        // 클릭 시점에 lazy-load
        source: 'server',
        last_modified: it.last_modified || null,
        entries: it.entries || null,
      };
      item.title = deriveSessionTitle(item);
      sessions.push(item);
      added++;
    }
    if (added > 0) renderSessionList();
  } catch (err) {
    // 서버 세션 머지는 best-effort — 실패해도 신규 채팅은 정상 동작
    console.warn('서버 세션 목록 로드 실패:', err);
  }
}

// 세션 삭제 — 사이드바 X 버튼에서 호출. 서버(Redis + 트랜스크립트) 정리 후
// 로컬 sessions 배열에서도 제거하고 사이드바를 다시 그린다.
async function deleteSession(id, event) {
  // 위임 핸들러가 이미 stopPropagation 했지만 직접 호출 경로 보호용으로 유지
  if (event && event.stopPropagation) {
    event.stopPropagation();
  }
  const session = sessions.find(s => s.id === id);
  const label = session ? (session.title || id) : id;
  if (!confirm(`대화를 삭제하시겠습니까?\n\n${label}`)) return;

  // 서버 세션(과 로컬에서 이미 서버에 저장된 대화)은 DELETE 호출이 필요.
  // 빈 로컬 세션(아직 서버에 저장된 적 없는 "새 대화")은 서버 호출 생략.
  const hasServerRecord = !session || session.source === 'server' || (session.messages && session.messages.length > 0);
  if (hasServerRecord) {
    try {
      const resp = await fetch(`/v1/sessions/${encodeURIComponent(id)}`, { method: 'DELETE' });
      if (!resp.ok && resp.status !== 404) {
        alert(`삭제 실패 (HTTP ${resp.status})`);
        return;
      }
    } catch (err) {
      alert(`삭제 오류: ${err.message}`);
      return;
    }
  }

  // 로컬 상태 정리
  const idx = sessions.findIndex(s => s.id === id);
  if (idx >= 0) sessions.splice(idx, 1);

  // 현재 선택 세션을 지웠다면 새 세션을 연다
  if (currentSessionId === id) {
    if (sessions.length > 0) {
      switchSession(sessions[0].id);
    } else {
      newSession();
    }
  } else {
    renderSessionList();
  }
}

function renderSessionList() {
  const list = document.getElementById('sessionList');
  // 인라인 onclick 제거 — 컨테이너 위임(setupSessionListDelegation)이 클릭을 잡아간다.
  // 데이터는 data-sid 속성으로 안전하게 전달 (escape는 escapeHtml 한 번만).
  list.innerHTML = sessions.map(s => {
    const cls = s.id === currentSessionId ? 'active' : '';
    const title = escapeHtml(s.title || s.id);
    const sid = escapeHtml(s.id);
    return (
      `<div class="session-item ${cls}" data-sid="${sid}">
        <span class="session-title">${title}</span>
        <button class="session-delete-btn" title="대화 삭제" data-sid="${sid}">×</button>
       </div>`
    );
  }).join('');
}

function clearMessages() {
  const inner = document.getElementById('messagesInner');
  inner.innerHTML = `

      <img src="/static/images.png" alt="Nexus" class="welcome-logo">
      <h2>Nexus에 오신 것을 환영합니다</h2>

// ─── 첨부파일 ───
function handleFileSelect(event) {
  const files = Array.from(event.target.files);
  files.forEach(file => {
    if (file.size > 10 * 1024 * 1024) {
      alert(`파일이 너무 큽니다 (10MB 제한): ${file.name}`);
      return;
    }
    attachedFiles.push(file);
  });
  renderAttachPreview();
  event.target.value = '';
}

function renderAttachPreview() {
  const preview = document.getElementById('attachPreview');
  if (attachedFiles.length === 0) {
    preview.className = 'attach-preview';
    preview.innerHTML = '';
    return;
  }
  preview.className = 'attach-preview visible';
  preview.innerHTML = attachedFiles.map((f, i) =>
    `<div class="attach-chip">
      <span>${f.name} (${(f.size / 1024).toFixed(1)}KB)</span>
      <span class="remove" onclick="removeFile(${i})">&times;</span>
    </div>`
  ).join('');
}

function removeFile(index) {
  attachedFiles.splice(index, 1);
  renderAttachPreview();
}

async function readFileContents() {
  // 바이너리 파일 확장자 — 서버에 업로드하여 Scout 서브에이전트가 분석
  const binaryExts = ['.docx', '.doc', '.xlsx', '.xls', '.pdf', '.hwp', '.pptx'];
  // 텍스트 파일 최대 문자 수
  const MAX_CHARS = 12000;

  const contents = [];
  for (const file of attachedFiles) {
    const ext = '.' + file.name.split('.').pop().toLowerCase();

    if (binaryExts.includes(ext)) {
      // 바이너리 파일 → 서버 업로드 후 Scout 서브에이전트로 위임
      // (Worker 컨텍스트(8K)에 원문을 직접 적재하지 않기 위함)
      const uploadPath = await uploadFileToServer(file);
      if (uploadPath) {
        contents.push(
          `사용자가 문서 파일을 업로드했습니다.\n` +
          `파일명: ${file.name}\n` +
          `서버 경로: ${uploadPath}\n` +
          `Agent 도구를 사용해 subagent_type="scout"으로 이 파일을 분석하고 ` +
          `요약을 받아 주세요. scout가 DocumentProcess로 청크별로 읽어 ` +
          `핵심 내용만 반환할 것입니다.`
        );
      } else {
        contents.push(`[첨부파일 업로드 실패: ${file.name}]`);
      }
      continue;
    }

    let text = await file.text();
    if (text.length > MAX_CHARS) {
      text = text.substring(0, MAX_CHARS) +
        `\n\n... [파일이 길어 ${MAX_CHARS}자까지만 포함됨. 전체 ${text.length}자 중 일부.]`;
    }
    contents.push(`[첨부파일: ${file.name}]\n${text}`);
  }
  return contents.join('\n\n');
}

async function uploadFileToServer(file) {
  try {
    const formData = new FormData();
    formData.append('file', file);
    const resp = await fetch('/v1/upload', { method: 'POST', body: formData });
    const data = await resp.json();
    if (data.status === 'ok') {
      return data.file_path;
    }
    return null;
  } catch (e) {
    console.error('파일 업로드 실패:', e);
    return null;
  }
}

// ─── 메시지 표시 ───
function appendMessage(role, content, save = true) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const inner = document.getElementById('messagesInner');
  const div = document.createElement('div');
  div.className = 'message';

  const sender = role === 'user' ? '사용자' : 'Nexus';
  const avatarHtml = role === 'user'
    ? `<div class="message-avatar user">U</div>`
    : `<img src="/static/images.png" alt="N" class="message-avatar assistant" style="object-fit:cover;">`;

  div.innerHTML = `
    <div class="message-header">
      ${avatarHtml}
      <div class="message-sender">${sender}</div>
    </div>
    <div class="message-body">${formatContent(content)}</div>`;

  inner.appendChild(div);
  scrollToBottom();

  if (save) {
    const session = sessions.find(s => s.id === currentSessionId);
    if (session) {
      session.messages.push({ role, content });
      if (role === 'user' && session.title === '새 대화') {
        session.title = content.substring(0, 30) + (content.length > 30 ? '...' : '');
        renderSessionList();
      }
    }
  }
  return div;
}

// 인라인 서식(굵기 / 인라인코드 / 링크)을 "이미 이스케이프된" 텍스트 조각에 적용.
// 제목·목록 항목·단락 내부 어디서든 재사용되므로 별도 함수로 분리했다.
// 왜 이스케이프 이후에 적용하나: 사용자/모델 원문의 < > & 를 먼저 무력화(XSS 방지)한
// 뒤, 우리가 만드는 서식 태그(<strong> 등)만 신뢰해 삽입하기 위함.
function applyInline(s) {
  // 1) 인라인 코드( `code` )를 먼저 플레이스홀더로 빼둔다.
  //    안 그러면 코드 안의 ** 나 [](): 같은 문자가 굵기/링크로 잘못 해석됨.
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => {
    codes.push(c);
    return '' + (codes.length - 1) + '';
  });
  // 2) 굵기: **텍스트** → <strong>
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // 3) 링크: [라벨](url) → <a>. 상대경로·http(s)만 허용.
  //    /v1/download/ 링크는 모델이 파일명(uuid)을 잘못 옮길 수 있으므로 클릭
  //    링크로 만들지 않고 라벨 텍스트만 남긴다(실제 다운로드는 캔버스/버튼 담당).
  //    라벨·url 모두 상위에서 이미 이스케이프된 상태다.
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => {
    const u = url.trim();
    if (u.startsWith('/v1/download/')) return label;
    if (!/^(\/|https?:\/\/)/.test(u)) return label;
    return `<a href="${u}">${label}</a>`;
  });
  // 4) 인라인 코드 플레이스홀더 복원
  s = s.replace(/(\d+)/g, (_, i) => `<code>${codes[i]}</code>`);
  return s;
}

// 채팅 응답/문서 미리보기 공용 마크다운 렌더러.
// 지원: 펜스 코드블록(```), 인라인코드(`), 굵기(**), 링크([]()),
//       제목(#/##/### → h2/h3/h4), 순서없는 목록(- / *) + 들여쓰기 중첩,
//       순서있는 목록(1. 2. …), 빈 줄 단락 분리.
function formatContent(text) {
  if (text === null || text === undefined) text = '';

  // 1) 펜스 코드블록을 먼저 추출해 플레이스홀더로 치환한다.
  //    코드 내부는 마크다운 파싱 대상에서 제외하기 위함(개별로 이스케이프).
  const codeBlocks = [];
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    const idx = codeBlocks.length;
    codeBlocks.push(`<pre><code>${escapeHtml(code.replace(/\n+$/, ''))}</code></pre>`);
    // 앞뒤 개행으로 감싸 코드블록이 항상 독립된 라인이 되게 한다.
    return `\n${idx}\n`;
  });

  // 2) 전체 텍스트를 HTML 이스케이프한다(XSS 방지).
  //    마크다운 기호(#, *, -, `, [, ])는 이스케이프 대상이 아니라 그대로 남는다.
  text = escapeHtml(text);

  // 3) 라인 단위 블록 파싱
  const lines = text.split('\n');
  let html = '';
  let para = [];              // 현재 누적 중인 단락 라인들
  const listTypes = [];      // 열린 목록 타입 스택 ('ul' | 'ol')
  const listIndents = [];    // 각 목록 레벨의 들여쓰기 폭(공백 수)

  // 누적된 단락을 <p>로 방출
  function flushPara() {
    if (para.length) {
      html += '<p>' + para.map(applyInline).join('<br>') + '</p>';
      para = [];
    }
  }
  // 열린 목록을 모두 닫는다
  function flushList() {
    while (listTypes.length) {
      html += '</li></' + listTypes.pop() + '>';
      listIndents.pop();
    }
  }

  const cbLineRe = /^(\d+)$/;   // 코드블록 플레이스홀더 라인

  for (const rawLine of lines) {
    const line = rawLine.replace(/\s+$/, '');   // 우측 공백 제거(좌측 들여쓰기는 보존)
    const trimmed = line.trim();

    // 코드블록 플레이스홀더 라인 — 단락/목록을 닫고 그대로 삽입(뒤에서 복원)
    const cbm = trimmed.match(cbLineRe);
    if (cbm) {
      flushPara(); flushList();
      html += '' + cbm[1] + '';
      continue;
    }

    // 빈 줄 → 단락 경계(목록은 유지: 다음 줄이 목록이면 이어서 이어붙는다)
    if (trimmed === '') {
      flushPara();
      continue;
    }

    // 제목: #/##/### … → h2/h3/h4 …
    const h = trimmed.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushPara(); flushList();
      const level = Math.min(h[1].length + 1, 6);   // # → h2
      html += `<h${level}>${applyInline(h[2].trim())}</h${level}>`;
      continue;
    }

    // 목록 항목: 순서없음(-, *) 또는 순서있음(1. 2. …)
    let m = line.match(/^(\s*)[-*]\s+(.*)$/);
    let type = null, indent = 0, content = '';
    if (m) { type = 'ul'; indent = m[1].length; content = m[2]; }
    else {
      m = line.match(/^(\s*)\d+\.\s+(.*)$/);
      if (m) { type = 'ol'; indent = m[1].length; content = m[2]; }
    }

    if (type) {
      flushPara();
      const c = applyInline(content.trim());
      // 현재 들여쓰기보다 깊게 열린 목록은 닫는다
      while (listTypes.length && indent < listIndents[listIndents.length - 1]) {
        html += '</li></' + listTypes.pop() + '>';
        listIndents.pop();
      }
      const top = listTypes.length - 1;
      if (top >= 0 && indent === listIndents[top] && listTypes[top] === type) {
        // 같은 레벨·같은 종류 → 형제 항목
        html += '</li><li>' + c;
      } else if (top >= 0 && indent === listIndents[top] && listTypes[top] !== type) {
        // 같은 들여쓰기지만 종류가 다름 → 기존 목록 닫고 새 종류로 시작
        html += '</li></' + listTypes.pop() + '>';
        listIndents.pop();
        html += '<' + type + '><li>' + c;
        listTypes.push(type); listIndents.push(indent);
      } else {
        // 더 깊은 들여쓰기(자식) 또는 최초 목록 → 새 목록 시작(부모 <li>는 열린 채 중첩)
        html += '<' + type + '><li>' + c;
        listTypes.push(type); listIndents.push(indent);
      }
      continue;
    }

    // 그 밖의 일반 텍스트 → 단락으로 누적(목록은 여기서 닫는다)
    flushList();
    para.push(trimmed);
  }
  flushPara();
  flushList();

  // 4) 코드블록 플레이스홀더 복원
  html = html.replace(/(\d+)/g, (_, i) => codeBlocks[i] || '');
  return html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ─── 스피너 ───
// _thinkingStartedAt은 장기 대기 감지용. 60초가 넘으면 안내 문구를 바꿔
// 사용자가 "무한 로딩"으로 오해하지 않게 한다. _thinkingTimer는 주기 갱신 핸들.
let _thinkingStartedAt = 0;
let _thinkingTimer = null;
const LONG_WAIT_SECONDS = 60;

function showThinking() {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const inner = document.getElementById('messagesInner');
  const div = document.createElement('div');
  div.id = 'thinkingIndicator';
  div.className = 'message';
  div.innerHTML = `
    <div class="message-header">
      <img src="/static/images.png" alt="N" class="message-avatar assistant" style="object-fit:cover;">
      <div class="message-sender">Nexus</div>
    </div>
    <div class="thinking">
      <span id="thinkingLabel">생각하는 중</span>
      <div class="thinking-dots"><span></span><span></span><span></span></div>
    </div>`;
  inner.appendChild(div);
  scrollToBottom();

  // 장기 대기 감지 — 초 단위로 업데이트. 60초 넘으면 문구 전환.
  _thinkingStartedAt = Date.now();
  if (_thinkingTimer) clearInterval(_thinkingTimer);
  _thinkingTimer = setInterval(() => {
    const label = document.getElementById('thinkingLabel');
    if (!label) return;
    const elapsed = Math.floor((Date.now() - _thinkingStartedAt) / 1000);
    if (elapsed >= LONG_WAIT_SECONDS) {
      label.textContent =
        `분석이 오래 걸리고 있습니다 (${elapsed}s). ` +
        `필요하면 '취소' 버튼을 눌러 중단할 수 있습니다`;
    } else if (elapsed >= 10) {
      label.textContent = `생각하는 중 (${elapsed}s)`;
    }
  }, 1000);
}

function hideThinking() {
  const el = document.getElementById('thinkingIndicator');
  if (el) el.remove();
  if (_thinkingTimer) {
    clearInterval(_thinkingTimer);
    _thinkingTimer = null;
  }
}

// ─── 스트리밍 메시지 ───
function startStreamingMessage() {
  hideThinking();
  // 새 스트리밍 메시지 시작 — 체크리스트 패널이 새로 그려지므로 revision 가드도 리셋한다
  // (턴/세션이 바뀌어 revision이 낮아져도 이번 턴의 첫 todo_update를 반드시 표시).
  lastTodoRevision = -1;
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const inner = document.getElementById('messagesInner');
  const div = document.createElement('div');
  div.className = 'message';
  div.id = 'streamingMessage';

  div.innerHTML = `
    <div class="message-header">
      <img src="/static/images.png" alt="N" class="message-avatar assistant" style="object-fit:cover;">
      <div class="message-sender">Nexus</div>
    </div>
    <div class="activity-area" id="streamingActivity">
      <div class="todo-panel" id="todoPanel" style="display:none"></div>
      <div class="activity-trail" id="activityTrail"></div>
      <div class="activity-results" id="activityResults"></div>
      <div class="activity-live" id="activityLive" style="display:none"></div>
    </div>
    <div class="model-thinking" id="streamingThinking" style="display:none"></div>
    <div class="message-body streaming-cursor" id="streamingBody"></div>`;

  // 스트리밍 thinking 상태 초기화
  // 서버(Qwen3.5)는 enable_thinking=false라 기본적으로 <think> 태그를
  // 보내지 않는다. 따라서 UI도 "일반 모드"로 시작한다. <think>가 등장할
  // 때만 thinking 모드로 전환한다.
  _streamThinking = false;
  _streamThinkBuf = '';

  inner.appendChild(div);
  scrollToBottom();
  return div;
}

// 스트리밍 중 thinking 상태 (기본: 일반 모드)
let _streamThinking = false;
let _streamThinkBuf = '';

function appendStreamChunk(text) {
  const thinkEl = document.getElementById('streamingThinking');
  const body = document.getElementById('streamingBody');
  if (!body) return;

  if (_streamThinking) {
    // 현재 thinking 모드 — </think>가 오면 종료하고 이후 텍스트를 본문에
    const closeIdx = text.indexOf('</think>');
    if (closeIdx !== -1) {
      _streamThinkBuf += text.substring(0, closeIdx);
      _streamThinking = false;
      if (thinkEl && _streamThinkBuf.trim()) {
        const short = _streamThinkBuf.trim().substring(0, 120).replace(/\n/g, ' ');
        thinkEl.textContent = short;
        thinkEl.style.display = 'block';
      }
      const after = text.substring(closeIdx + 8);
      if (after) body.textContent += after;
    } else {
      _streamThinkBuf += text;
      if (thinkEl) {
        thinkEl.textContent = _streamThinkBuf.trim().substring(0, 80).replace(/\n/g, ' ');
        thinkEl.style.display = 'block';
      }
    }
  } else {
    // 일반 모드 — <think>가 등장하면 thinking 모드로 진입, 아니면 본문에 append
    const openIdx = text.indexOf('<think>');
    if (openIdx !== -1) {
      // <think> 이전 부분은 본문에
      if (openIdx > 0) body.textContent += text.substring(0, openIdx);
      _streamThinking = true;
      const afterOpen = text.substring(openIdx + 7);
      // 같은 청크에 </think>까지 있는 경우 재귀 처리
      if (afterOpen) appendStreamChunk(afterOpen);
    } else {
      body.textContent += text;
    }
  }
  scrollToBottom();
}

// (1b) 도구 실행이 시작되면 그 시점까지 누적된 답변 본문을 "중간 나레이션"으로 보고
//      버퍼(streamingBody 표시 + thinking 임시 버퍼)를 비운다. 이렇게 하면 도구가
//      여러 번 불려도 최종 답변 = "마지막 도구 이후의 텍스트 세그먼트"만 남아 깨끗하다.
//      (claude에서 중간 단계 텍스트가 접히는 것과 동일한 동작)
//      도구가 전혀 없는 순수 대화에서는 호출되지 않아 회귀가 없다.
function resetStreamingBody() {
  const body = document.getElementById('streamingBody');
  if (body) body.textContent = '';
  // 중간 나레이션에 딸린 thinking 임시 상태도 함께 정리
  _streamThinking = false;
  _streamThinkBuf = '';
  const thinkEl = document.getElementById('streamingThinking');
  if (thinkEl) { thinkEl.textContent = ''; thinkEl.style.display = 'none'; }
}

function finalizeStreamingMessage() {
  const body = document.getElementById('streamingBody');
  const thinkEl = document.getElementById('streamingThinking');
  if (body) {
    body.classList.remove('streaming-cursor');
    let raw = body.textContent;
    // 만약 </think> 없이 스트림이 끝났는데 thinking 중이었다면 버퍼의
    // 내용을 본문에 합쳐 넣는다 (사용자에게 빈 응답 방지)
    if (_streamThinking && _streamThinkBuf.trim() && !raw.trim()) {
      raw = _streamThinkBuf.trim();
      body.textContent = raw;
    }
    body.innerHTML = formatContent(raw);
    body.removeAttribute('id');

    const session = sessions.find(s => s.id === currentSessionId);
    if (session) {
      session.messages.push({ role: 'assistant', content: raw });
    }
  }
  if (thinkEl) thinkEl.removeAttribute('id');

  // 활동 영역 정리 — 라이브 인디케이터는 제거하고, 완료 트레일은 흐리게 남긴다.
  // 트레일이 비어 있으면(도구를 안 쓴 순수 텍스트 응답) 빈 박스를 없앤다.
  activityHideLive();
  const act = document.getElementById('streamingActivity');
  if (act) {
    const liveEl = document.getElementById('activityLive');
    if (liveEl) liveEl.remove();
    const trail = document.getElementById('activityTrail');
    const results = document.getElementById('activityResults');
    const hasTrail = trail && trail.children.length > 0;
    const hasResults = results && results.children.length > 0;   // 접힌 도구결과 블록이 하나라도 있으면 유지
    if (!hasTrail && !hasResults) {
      act.remove();   // 남길 게 없으면(순수 텍스트 응답) 활동 영역 자체를 제거
    } else {
      // id를 떼어 다음 스트림의 새 활동 영역과 충돌하지 않게 한다
      act.removeAttribute('id');
      if (trail) trail.removeAttribute('id');
      if (results) results.removeAttribute('id');
      act.classList.add('activity-final');
    }
  }

  const msg = document.getElementById('streamingMessage');
  if (msg) msg.removeAttribute('id');
  // 상태 리셋 — 다음 스트림도 기본 "일반 모드"로 시작
  _streamThinking = false;
  _streamThinkBuf = '';
}

// ─── 활동 표시 (도구/사고 실시간 표시) ───
// 도구명 → 한글 친화 라벨. 맵에 없으면 도구명을 그대로 쓴다.
const TOOL_LABELS = {
  Read: '파일 읽는 중',
  Grep: '검색 중',
  Glob: '파일 찾는 중',
  LS: '디렉터리 확인 중',
  SymbolSearch: '심볼 찾는 중',
  DocumentProcess: '문서 분석 중',
  DocumentExport: '문서 생성 중',
  Bash: '명령 실행 중',
  Edit: '파일 편집 중',
  Write: '파일 작성 중',
  GitDiff: '변경 확인 중',
  Agent: '하위 작업 위임 중',
};

// 도구명 → 라벨. 완료 트레일용으로 "…중" 어미가 그대로 쓰여도 자연스럽다.
function activityToolLabel(name) {
  return TOOL_LABELS[name] || name || '작업 중';
}

// tool_use_start / thinking_start — 진행 중 라이브 인디케이터를 표시/갱신한다.
// kind: 'tool' | 'thinking'. toolName/toolDesc는 'tool'일 때만 사용.
// toolDesc: 백엔드가 내려주는 사람이 읽는 라벨(예 "scout: 문서 분석"). 있으면 우선 표시,
//           없으면 기존 activityToolLabel(toolName) 폴백.
function activityStart(kind, toolName, toolDesc) {
  const live = document.getElementById('activityLive');
  if (!live) return;
  if (kind === 'thinking') {
    live.innerHTML =
      '<span class="activity-spinner"></span>' +
      '<span class="activity-live-text">💭 생각 중…</span>';
  } else {
    // tool_desc 우선, 없으면 도구명 기반 한글 라벨
    const label = (toolDesc && toolDesc.trim()) ? toolDesc : activityToolLabel(toolName);
    live.innerHTML =
      '<span class="activity-spinner"></span>' +
      '<span class="activity-live-text">🔧 ' + escapeHtml(label) +
      ' · <span class="activity-tool-name">' + escapeHtml(toolName || '') + '</span></span>';
  }
  live.style.display = 'flex';
  scrollToBottom();
}

// tool_use_stop / thinking_stop — 해당 단계를 완료 처리한다.
// 도구는 완료 트레일("✓ …")에 누적하고, 사고는 트레일 없이 라이브만 해제.
// toolDesc: 있으면 라벨로 우선 사용(activityStart와 동일 규칙).
function activityStop(kind, toolName, toolDesc) {
  if (kind === 'tool') {
    const trail = document.getElementById('activityTrail');
    if (trail) {
      const name = toolName || '';
      // 표시 라벨은 tool_desc 우선, 없으면 도구명 기반 한글 라벨
      const label = (toolDesc && toolDesc.trim()) ? toolDesc : activityToolLabel(name);
      // 접기(×N) 판정 키 — 화면에 찍히는 라벨 기준으로 잡는다. 이렇게 하면 같은 도구라도
      // tool_desc가 다르면(예 "scout: 문서 분석" vs "scout: 코드 검색") 서로 다른 줄로 분리된다.
      const key = label + ' ' + name;
      const last = trail.lastElementChild;
      // (1a) 직전 트레일 항목과 같은 라벨이면 새 줄을 추가하지 않고 카운트만 올린다.
      //      "✓ 문서 분석 중 · DocumentProcess ×10" 처럼 claude식으로 접어 도배를 막는다.
      //      (연속으로 같은 라벨일 때만 합친다 — 중간에 다른 도구가 끼면 새 줄로 분리)
      if (last && last.getAttribute('data-activity-key') === key) {
        const cur = parseInt(last.getAttribute('data-count') || '1', 10) + 1;
        last.setAttribute('data-count', String(cur));
        // 카운트 배지(×N)는 textContent로만 갱신 — 숫자라 XSS 위험 없음
        let countEl = last.querySelector('.activity-count');
        if (!countEl) {
          countEl = document.createElement('span');
          countEl.className = 'activity-count';
          const textEl = last.querySelector('.activity-step-text');
          if (textEl) textEl.appendChild(countEl);
        }
        countEl.textContent = ' ×' + cur;
      } else {
        // 새 도구(또는 트레일 첫 항목) → 새 줄 추가. data-activity-key/data-count로 접기 상태 보관.
        const step = document.createElement('div');
        step.className = 'activity-step';
        step.setAttribute('data-activity-key', key);
        step.setAttribute('data-count', '1');
        step.innerHTML =
          '<span class="activity-check">✓</span>' +
          '<span class="activity-step-text">' + escapeHtml(label) +
          ' · <span class="activity-tool-name">' + escapeHtml(name) + '</span></span>';
        trail.appendChild(step);
      }
    }
  }
  activityHideLive();
  scrollToBottom();
}

// 신규 tool_result 프레임 — 도구/서브에이전트의 실행 결과를 "접힌 상세 블록"으로 쌓는다.
// data = { type:'tool_result', session_id, tool_use_id, name, tool_desc?, is_error, preview, content }
//   - preview: 짧은 한 줄 요약(summary에 표시)
//   - content: 전체 원문(마크다운/텍스트, 최대 16k자) → 펼치면 formatContent로 렌더
// 메인 답변 말풍선(streamingBody)이 아니라 activity-results 영역에 넣어, 도구 원문이
// 최종 답변에 섞이지 않게 한다(#3). 기본은 접힘 상태.
function renderToolResult(data) {
  const results = document.getElementById('activityResults');
  if (!results) return;

  const name = data.name || '';
  // 라벨은 tool_desc 우선, 없으면 도구명 기반 한글 라벨(활동라인과 동일 규칙)
  const label = (data.tool_desc && data.tool_desc.trim()) ? data.tool_desc : activityToolLabel(name);
  const preview = data.preview || '';
  const content = data.content || '';

  const box = document.createElement('details');
  box.className = 'tool-result' + (data.is_error ? ' is-error' : '');

  // 요약 줄 — 모든 사용자/모델 문자열은 escapeHtml 경유(XSS 방지)
  const summary = document.createElement('summary');
  summary.innerHTML =
    '<span class="tr-caret">▸</span>' +
    '<span class="tr-label">' + escapeHtml(label) + '</span>' +
    (preview ? '<span class="tr-sep">·</span>' +
               '<span class="tr-preview">' + escapeHtml(preview) + '</span>' : '');
  box.appendChild(summary);

  // 펼침 본문 — 공용 마크다운 렌더러 재사용(내부에서 escape 처리됨)
  const bodyEl = document.createElement('div');
  bodyEl.className = 'tool-result-body';
  bodyEl.innerHTML = formatContent(content);
  box.appendChild(bodyEl);

  results.appendChild(box);
  scrollToBottom();
}

// 계획 체크리스트(TodoWrite) 패널을 전체 교체한다.
// data = { type:'todo_update', session_id, revision, stats, todos:[{content,status,active_form}] }
//   - [x] 완료(취소선) / [~] 진행 중(active_form 강조) / [ ] 대기
//   - revision으로 중복·역순 프레임을 무시한다(전체 교체라 diff 불필요).
//   - 스트리밍 종료 후에도 패널은 유지한다(최종 계획 상태를 계속 보여줌).
let lastTodoRevision = -1;
function renderTodoUpdate(data) {
  const panel = document.getElementById('todoPanel');
  if (!panel) return;
  const rev = (typeof data.revision === 'number') ? data.revision : 0;
  // 오래된(또는 중복) 프레임은 무시한다.
  if (rev <= lastTodoRevision) return;
  lastTodoRevision = rev;

  const todos = Array.isArray(data.todos) ? data.todos : [];
  if (todos.length === 0) { panel.style.display = 'none'; panel.innerHTML = ''; return; }

  const st = data.stats || {};
  const total = st.total != null ? st.total : todos.length;
  const done = st.completed != null ? st.completed : 0;

  const icon = { completed: '✔', in_progress: '◐', pending: '○' };
  let rows = '';
  for (const t of todos) {
    const status = t.status || 'pending';
    const cls = 'todo-item todo-' + status;
    const mark = icon[status] || '○';
    // 진행 중이면 active_form(있으면)을 꼬리표로 강조한다.
    let tail = '';
    if (status === 'in_progress') {
      const af = (t.active_form && t.active_form.trim()) ? t.active_form : '진행 중';
      tail = '<span class="todo-active"> ← ' + escapeHtml(af) + '</span>';
    }
    rows += '<div class="' + cls + '"><span class="todo-mark">' + mark + '</span>' +
            '<span class="todo-text">' + escapeHtml(t.content || '') + '</span>' + tail + '</div>';
  }
  panel.innerHTML =
    '<div class="todo-head"><span class="todo-title">작업 체크리스트</span>' +
    '<span class="todo-count">' + done + '/' + total + '</span></div>' +
    '<div class="todo-list">' + rows + '</div>';
  panel.style.display = 'block';
  scrollToBottom();
}

// 라이브 인디케이터를 감춘다. 답변 텍스트가 시작되거나 단계가 끝날 때 호출.
function activityHideLive() {
  const live = document.getElementById('activityLive');
  if (live) {
    live.style.display = 'none';
    live.innerHTML = '';
  }
}

// 서버가 내려준 정확한 다운로드 링크로 버튼을 만든다. dl-link 클래스라 위의
// 클릭 핸들러(인증 fetch→blob 저장)가 처리한다. 모델 텍스트의 URL 오탈자와 무관.
// (2) '📄 미리보기' 버튼은 제거했다 — 문서 미리보기는 스트림 종료 후 우측 캔버스가
//     claude 아티팩트처럼 자동으로 열린다(아래 sendMessage finalize 참조).
function renderDownloadButtons(msgEl, downloads) {
  const body = msgEl.querySelector('.message-body') || msgEl;
  const wrap = document.createElement('div');
  wrap.className = 'dl-wrap';
  for (const d of downloads) {
    // 다운로드 버튼 (인증 fetch→blob 다운로드는 dl-link 위임 핸들러가 담당)
    const a = document.createElement('a');
    a.className = 'dl-link';
    a.href = d.url;
    a.textContent = '⬇ ' + decodeURIComponent(d.filename);
    wrap.appendChild(a);
  }
  body.appendChild(wrap);
}

// ─── 문서 미리보기 캔버스 ───
// doc = { url, filename, content(마크다운), format }
function openCanvas(doc) {
  const panel = document.getElementById('canvasPanel');
  if (!panel) return;
  document.getElementById('canvasFilename').textContent =
    decodeURIComponent(doc.filename || '문서');
  const badge = document.getElementById('canvasBadge');
  if (doc.format) {
    badge.textContent = String(doc.format).toUpperCase();
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }
  const dl = document.getElementById('canvasDownload');
  dl.setAttribute('href', doc.url || '#');   // dl-link 위임 핸들러가 인증 다운로드 처리
  // 개선된 공용 렌더러 재사용 — 제목/목록/중첩까지 문서답게 표시
  document.getElementById('canvasBody').innerHTML = formatContent(doc.content || '');
  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');
}

function closeCanvas() {
  const panel = document.getElementById('canvasPanel');
  if (!panel) return;
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden', 'true');
}

// ─── 전송 ───
// _activeAbortController는 스트리밍 도중 사용자가 '취소'를 눌렀을 때 fetch를
// 중단하는 AbortController. 취소 시 서버에 의해 producer_task가 CancelledError
// 로 종료되고 query_engine의 finally 블록에서 트랜스크립트에 에러 엔트리가 남는다.
let _activeAbortController = null;

function cancelStream() {
  if (_activeAbortController) {
    _activeAbortController.abort();
  }
}

// 전송 버튼을 '전송'/'취소' 모드로 토글한다. HTML/onclick까지 직접 교체하여
// 전용 취소 버튼을 추가하지 않고도 같은 자리에서 기능을 스위치한다.
function setSendButtonMode(mode) {
  const btn = document.getElementById('sendBtn');
  if (!btn) return;
  if (mode === 'cancel') {
    btn.title = '취소';
    btn.setAttribute('data-mode', 'cancel');
    btn.disabled = false;
    btn.onclick = cancelStream;
    btn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
        <rect x="6" y="6" width="12" height="12" rx="2"/>
      </svg>`;
  } else {
    btn.title = '전송';
    btn.setAttribute('data-mode', 'send');
    btn.disabled = false;
    btn.onclick = sendMessage;
    btn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z"/>
      </svg>`;
  }
}

// ============================================================================
// SSE 실시간 스트리밍 채팅 전송
// 작성자: 이현수 / 작성일: 2026-07-05
//
// 이 함수 하나가 "사용자가 입력창에 글을 써서 보내면, 서버가 답변을 만들어가는
// 과정을 화면에 토큰 단위로 실시간으로 그려주는" 전체 흐름을 맡는다.
// 한 번에 완성된 답을 받는 게 아니라, 서버가 글자를 조금씩 흘려보내면 그때그때
// 말풍선에 이어붙이는 방식이라 체감 반응이 빠르다.
//
// 전체 흐름을 단계로 풀면:
//   1) 입력창 글자 + (있다면) 첨부파일 내용을 하나의 message 문자열로 합친다.
//   2) 화면에 내 말풍선을 먼저 띄우고, 전송 버튼을 '취소' 버튼으로 바꾼다.
//      (스트리밍 도중 같은 버튼을 눌러 중간에 끊을 수 있게 하려는 것)
//   3) 서버 API 를 호출한다:  POST /v1/chat/stream
//        - 요청 본문(JSON): { message: 내가 쓴 글, session_id: 지금 대화방 id }
//        - 응답 형식      : 일반 JSON 이 아니라 text/event-stream (SSE).
//          즉 답이 다 만들어질 때까지 기다리지 않고, 서버가 만드는 즉시 조각을 보낸다.
//   4) fetch 응답의 본문 스트림을 reader 로 직접 읽는다(response.body.getReader()).
//      네트워크로 오는 건 바이트라서 TextDecoder 로 글자로 풀고, 줄바꿈('\n') 기준으로
//      잘라 한 줄씩 본다. 한 줄이 도중에 끊길 수 있으니 마지막 조각은 buffer 에 남겨
//      다음 수신분과 이어붙인다.
//      각 데이터 줄은 "data: {JSON}" 모양이고, ':' 로 시작하는 줄은 연결이 살아있음을
//      알리는 heartbeat(주석 줄)이라 그냥 버린다.
//   5) 줄에서 꺼낸 JSON 의 data.type 값에 따라 갈래를 나눠 처리한다:
//        · tool_use_start / tool_use_stop  → "지금 무슨 도구를 쓰는 중"을 활동영역에 표시
//        · thinking_start / thinking_stop  → "생각하는 중" 표시
//        · tool_use_delta / thinking_delta → 도구 인자·사고 과정의 부스러기(노이즈) → 무시
//        · data.text 가 들어있으면          → 답변 본문에 그대로 이어붙임(말풍선 실시간 갱신)
//        · usage_update                    → 입력/출력 토큰 수 갱신
//        · message_stop                    → 답변 끝 신호(토큰 수가 안 왔으면 글자 길이로 추정)
//        · error                           → 서버가 준 오류 메시지를 답변 자리에 표시
//        · download                        → 파일 생성 도구가 만든 다운로드 링크를 모아둠
//   6) 스트림이 끝나면 말풍선을 최종본으로 확정(마크다운 렌더 등)하고, 모아둔 다운로드가
//      있으면 버튼을 그린 뒤, 미리볼 수 있는 문서는 오른쪽 캔버스를 자동으로 연다.
//   7) 성공이든 취소든 오류든, 마지막엔 스트리밍 상태를 풀고 버튼을 '전송'으로 되돌린다.
// ============================================================================
async function sendMessage() {
  // 입력창 요소를 잡고, 앞뒤 공백을 정리한 실제 보낼 텍스트를 만든다.
  const input = document.getElementById('userInput');
  let text = input.value.trim();
  // 보낼 글도 없고 첨부파일도 없으면 할 일이 없다. 또, 이미 스트리밍 중이면 중복 전송을 막는다.
  if (!text && attachedFiles.length === 0) return;
  if (isStreaming) return;

  // 첨부파일이 있으면 그 내용을 읽어 본문 앞에 붙인다. 이렇게 하면 모델이 "파일 내용 + 내 지시"를
  // 한 메시지로 함께 보게 된다. 붙인 뒤에는 첨부 목록을 비우고 미리보기도 다시 그린다.
  if (attachedFiles.length > 0) {
    const fileContents = await readFileContents();
    text = fileContents + (text ? '\n\n' + text : '\n\n위 첨부파일을 분석해 주세요.');
    attachedFiles = [];
    renderAttachPreview();
  }

  // 입력창을 비우고 높이를 원래대로 줄인 뒤, 방금 보낸 글을 내 말풍선으로 화면에 먼저 띄운다.
  input.value = '';
  autoResize(input);
  appendMessage('user', text);

  // 이제부터 스트리밍이 진행 중임을 표시하고, 전송 버튼을 '취소' 모드로 바꿔 중간 중단을 허용한다.
  isStreaming = true;
  setSendButtonMode('cancel');

  // 답변 도착 전까지 "생각 중..." 인디케이터를 보여준다.
  showThinking();
  let streamStarted = false;          // 답변 말풍선을 아직 안 만들었으면 false (첫 조각 도착 시 생성)
  let userAborted = false;            // 사용자가 취소를 눌러 끝났는지 여부
  let pendingDownloads = [];          // 서버가 보낸 정확한 다운로드 링크들을 모아두는 곳({url, filename, content, format})
  // 취소 버튼으로 fetch 자체를 끊기 위한 AbortController. 이 signal 을 아래 fetch 에 물린다.
  _activeAbortController = new AbortController();

  try {
    // 스트리밍 채팅 API 호출. 응답이 SSE 라서 아래에서 body 스트림을 직접 읽어 나간다.
    const response = await fetch('/v1/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,               // 사용자가 보낸 (첨부 포함) 전체 메시지
        session_id: currentSessionId, // 대화 이어가기용 세션 식별자
      }),
      signal: _activeAbortController.signal, // 취소 시 이 요청을 중단
    });

    // 응답 본문(ReadableStream)을 조각 단위로 읽기 위한 reader 와, 바이트→글자 변환기.
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';                  // 아직 한 줄로 완성되지 않은 꼬리 텍스트를 담아두는 버퍼

    // 스트림이 끝날 때까지 계속 읽는다.
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;               // 서버가 스트림을 닫으면 종료

      // 이번에 받은 바이트를 글자로 풀어 버퍼에 이어붙인 뒤, 줄 단위로 자른다.
      // 마지막 조각(buffer)은 다음 수신분과 합쳐야 하므로 pop 으로 떼어 보관한다.
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        // ':' 로 시작하는 줄은 SSE 주석(연결 유지용 heartbeat)이라 의미가 없으니 건너뛴다.
        if (line.startsWith(':')) continue;
        // 실제 데이터는 "data: " 로 시작한다. 그 뒤(6글자 이후)의 JSON 을 파싱한다.
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.substring(6));

            // ─── (A) 활동(도구/사고) 이벤트를 먼저 처리 ───
            // "지금 무슨 일을 하는 중인지"를 말풍선 안에 실시간으로 보여주는 부분이다.
            // 도구/사고 이벤트는 보통 답변 텍스트보다 먼저 오므로, 답변 말풍선이 아직
            // 없으면 여기서 먼저 만들어 둔다(본문은 비어 있고 활동 영역만 보이는 상태).
            if (data.type === 'tool_use_start') {
              if (!streamStarted) { streamStarted = true; startStreamingMessage(); }
              // 도구를 쓰기 직전까지 흘러나온 본문은 대개 "이제 ~를 해볼게요" 같은 중간 나레이션이다.
              // 최종 답변을 깨끗하게 남기려고 그 부분을 리셋한다.
              resetStreamingBody();
              // tool_desc(있으면)를 넘겨 "🔧 scout: 문서 분석"처럼 사람이 읽는 라벨로 표시
              activityStart('tool', data.tool_name, data.tool_desc);   // 활동영역에 "○○ 도구 실행 중" 표시 시작
            } else if (data.type === 'tool_use_stop') {
              activityStop('tool', data.tool_name, data.tool_desc);    // 해당 도구 실행 완료 처리(중복은 ×N 으로 접힘)
            } else if (data.type === 'tool_result') {
              // 신규 tool_result — 도구/서브에이전트 결과를 접힌 상세 블록으로 활동영역에 쌓는다.
              // 답변 말풍선에 원문이 새어들지 않도록 여기(활동영역)에서만 처리하고 아래 (B)로 넘기지 않는다.
              if (!streamStarted) { streamStarted = true; startStreamingMessage(); }
              renderToolResult(data);
            } else if (data.type === 'todo_update') {
              // 계획 체크리스트(TodoWrite) 갱신 — 서버가 TodoStore에서 뽑은 구조화 목록.
              // 활동영역 상단의 고정 패널을 전체 교체한다(revision으로 중복/역순 프레임 무시).
              if (!streamStarted) { streamStarted = true; startStreamingMessage(); }
              renderTodoUpdate(data);
            } else if (data.type === 'thinking_start') {
              if (!streamStarted) { streamStarted = true; startStreamingMessage(); }
              activityStart('thinking', null);          // "생각하는 중" 표시 시작
            } else if (data.type === 'thinking_stop') {
              activityStop('thinking', null);           // 생각 종료
            } else if (data.type === 'tool_use_delta' || data.type === 'thinking_delta') {
              // 도구 인자 조각 / 사고 과정 조각은 화면에 그대로 보여줄 내용이 아니다(노이즈).
              // 특히 thinking_delta 는 text 필드를 갖고 있어서, 아래 "답변 누적" 경로로 새어들면
              // 사고 과정이 답변에 섞여버린다. 그래서 여기서 확실히 가로채 아무 것도 안 한다.
            } else {
              // ─── (B) 그 외: 실제 답변 텍스트 / 토큰 / 오류 / 다운로드 처리 ───
              // 답변의 첫 글자 조각이 도착했는데 말풍선이 아직 없으면 지금 만든다.
              if (data.text && !streamStarted) {
                streamStarted = true;
                startStreamingMessage();
              }

              if (data.text) {
                // 답변이 실제로 흐르기 시작하면 진행 중 인디케이터는 감춘다.
                // (완료된 활동 기록은 답변 위에 흐리게 그대로 남겨 둔다.)
                activityHideLive();
                appendStreamChunk(data.text);           // 도착한 글자 조각을 말풍선 본문에 이어붙임
              }

              // 토큰 사용량이 오면 입력/출력 카운터를 갱신한다(하단 표시용).
              if (data.type === 'usage_update' && data.usage) {
                totalInputTokens = data.usage.input_tokens || totalInputTokens;
                totalOutputTokens = data.usage.output_tokens || totalOutputTokens;
                updateTokenDisplay();
              }

              // 답변 종료 신호. 서버가 출력 토큰 수를 안 줬다면, 렌더된 글자 수로 대략 추정한다
              // (한글/영문 섞임을 감안해 4글자 ≈ 1토큰의 러프한 근사).
              if (data.type === 'message_stop') {
                if (totalOutputTokens === 0 && streamStarted) {
                  const body = document.getElementById('streamingBody');
                  if (body) {
                    totalOutputTokens += Math.ceil(body.textContent.length / 4);
                    totalInputTokens += Math.ceil(text.length / 4);
                    updateTokenDisplay();
                  }
                }
              }

              // 서버가 오류를 보고하면, 답변 말풍선을 (없으면 만들어) 그 자리에 오류 문구를 표시한다.
              if (data.type === 'error' && data.message) {
                if (!streamStarted) {
                  streamStarted = true;
                  startStreamingMessage();
                }
                activityHideLive();
                appendStreamChunk(`[오류] ${data.message}\n`);
              }

              // 파일 생성 도구(DocumentExport 등)가 만든 "정확한" 다운로드 링크는 서버가 직접 보낸다.
              // 모델 텍스트에서 URL 을 추측하지 않고 이 이벤트 값을 신뢰한다. 스트림이 끝난 뒤
              // 한꺼번에 버튼으로 그리려고 여기서는 목록에 모아만 둔다.
              if (data.type === 'download' && data.url) {
                pendingDownloads.push({
                  url: data.url,
                  filename: data.filename || data.url.split('/').pop(),
                  content: data.content || '',   // 문서의 마크다운 본문(오른쪽 미리보기 캔버스에 사용)
                  format: data.format || '',     // docx|pptx|hwpx|md|txt (버튼 배지 표시용)
                });
              }
            }
          } catch (e) { /* 한 프레임의 JSON 파싱이 실패해도 전체 스트림은 계속 진행 — 조용히 넘어간다 */ }
        }
      }
    }
  } catch (error) {
    // fetch/스트림 도중 예외. 취소(AbortError)와 그 밖의 연결 오류를 구분해 안내한다.
    if (error && error.name === 'AbortError') {
      userAborted = true;
      if (!streamStarted) startStreamingMessage();
      appendStreamChunk(`\n[취소됨] 사용자가 요청을 중단했습니다.`);
    } else {
      if (!streamStarted) startStreamingMessage();
      appendStreamChunk(`[연결 오류] ${error.message}`);
    }
  }

  // ─── 마무리 정리 ───
  hideThinking();
  // finalizeStreamingMessage() 가 'streamingMessage' id 를 떼어내므로, 그 전에 요소 참조를 잡아둔다
  // (아래 다운로드 버튼을 이 말풍선에 붙이기 위함).
  const _streamMsgEl = document.getElementById('streamingMessage');
  // 답변 말풍선이 만들어졌었다면 최종본으로 확정(마크다운 렌더링/스트리밍 표식 제거 등).
  if (streamStarted) finalizeStreamingMessage();
  if (pendingDownloads.length) {
    // 다운로드 버튼을 붙일 대상 말풍선. 답변 말풍선이 없던 경우(문서만 생성)엔 안내 버블을 새로 만든다.
    const target = _streamMsgEl || appendMessage('assistant', '문서를 생성했습니다.');
    renderDownloadButtons(target, pendingDownloads);
    // Claude 아티팩트처럼, 본문(content)이 있는 가장 최근 생성 문서를 오른쪽 캔버스에 자동으로 연다.
    // 캔버스가 이미 열려 있으면 openCanvas 가 내용만 갈아끼운다.
    const previewable = pendingDownloads.filter(d => d.content);
    if (previewable.length) {
      openCanvas(previewable[previewable.length - 1]);
    }
  }
  // 스트리밍 상태를 풀고, 취소 컨트롤러를 비우고, 버튼을 '전송'으로 되돌린 뒤 입력창에 포커스를 준다.
  isStreaming = false;
  _activeAbortController = null;
  setSendButtonMode('send');
  input.focus();
  // 취소로 끝난 경우라도 입력창에 원문을 되살리지는 않는다(원본은 이미 'user' 말풍선으로 남아 있음).
  // userAborted 는 위 흐름에서 표식 용도로만 쓰였으므로, 미사용 경고를 피하려 명시적으로 소비한다.
  void userAborted;
}

// ─── 헬스체크 ───
async function checkHealth() {
  const dot = document.getElementById('statusDot');
  try {
    const resp = await fetch('/health');
    const data = await resp.json();
    dot.className = data.status === 'ok' ? 'status-dot' : 'status-dot offline';
    dot.title = `GPU: ${data.gpu_server}`;
  } catch {
    dot.className = 'status-dot offline';
    dot.title = '서버 연결 실패';
  }
}

// ─── UI 유틸 ───
function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function scrollToBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
  requestAnimationFrame(() => {
    msgs.scrollTop = msgs.scrollHeight;
    setTimeout(() => { msgs.scrollTop = msgs.scrollHeight; }, 50);
  });
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}
</script>
