# =============================================================================
# Project Nexus — B200 로컬 vLLM 기동 프로파일
# =============================================================================
# 이 파일은 무엇인가:
#   B200 정부 컨테이너 안에서 vLLM 추론 서버를 기동할 때 쓰는 "설정표"이다.
#   scripts/start_vllm_local.py 가 이 파일을 읽어서 vLLM 실행 명령을 조립한다.
#
# 왜 별도 파일인가 (기존 _ssh_restart_vllm.py 와의 차이):
#   - 기존 스크립트는 원격 5090 서버(192.168.21.112)에 SSH로 접속해 기동한다.
#     AWQ 4bit·8K 컨텍스트·enforce-eager 등 5090 전용 값이 코드에 박혀 있다.
#   - B200은 "단일 컨테이너 안"에서 localhost로 기동하므로 SSH가 필요 없고,
#     BF16·긴 컨텍스트·CUDA graph 활성 등 값이 완전히 다르다.
#   - 그래서 5090 스크립트는 그대로 두고(무회귀), B200용 기동은 이 프로파일로 분리한다.
#
# bake-off 제약 (중요):
#   단일 B200 180GB에는 A.X-4.0 72B(BF16 ~144GB)와 HyperCLOVA 32B(~64GB)를
#   "동시에" 올릴 수 없다(합 208GB > 180GB). 따라서 한 번에 한 프로파일만 기동해
#   순차적으로 비교한다. 두 프로파일 모두 port 8001을 쓰는 이유가 이것이다 —
#   오케스트레이터 설정(gpu_server.url)은 localhost:8001 하나로 고정된다.

# 모든 프로파일이 공유하는 기본 기동 옵션
defaults:
  host: "127.0.0.1"                # 컨테이너 내부 localhost. 외부 노출 안 함(에어갭)
  trust_remote_code: true          # 커스텀 아키텍처(HyperCLOVA 등) 로딩 허용
  enable_prefix_caching: true      # 프롬프트 캐시 — 시스템 프롬프트/RAG 접두부 재사용
  enforce_eager: false             # B200은 CUDA graph 사용(지연 단축). 5090처럼 끄지 않는다
  enable_auto_tool_choice: true    # OpenAI tool_calls 자동 선택 활성
  log_dir: "/NHNHOME/nexus/logs"   # 기동 로그(영구 400GB 볼륨). 컨테이너 실측 경로

# 모델 참조 방식(중요):
#   컨테이너에 HF_HOME=/NHNHOME/nexus/hf_cache 가 설정되어 있고 외부망(huggingface.co)이
#   되므로(실측 HTTP 200), 모델을 로컬 경로 대신 HuggingFace repo id로 지정한다.
#   vLLM이 이 캐시에 1회 받아 영구 재사용한다(400GB 디스크 위).
#   에어갭 최종 배포 시에는: repo를 미리 HF_HOME 캐시에 받아두거나 로컬 경로
#   (예: /NHNHOME/nexus/models/A.X-4.0)로 바꾸고 가중치를 사전 반입한다.

profiles:
  # -------------------------------------------------------------------------
  # A.X-4.0 72B — SKT, Apache 2.0, Qwen2.5 기반
  #   Qwen 계열이라 Nexus의 기존 Qwen 프롬프트/파서 자산을 대부분 재사용한다.
  # -------------------------------------------------------------------------
  axmodel:
    model: "skt/A.X-4.0"                     # HF repo id → HF_HOME 캐시에 받아 재사용
    served_model_name: "ax-4.0"              # OpenAI API에 노출되는 모델 이름
    dtype: "bfloat16"                        # 계산 dtype(quantization=fp8와 병용: bf16 로드→FP8 양자화)
    quantization: "fp8"                      # 2026-07-05 FP8 전환(B200 네이티브, near-lossless 검증됨)
    # FP8: 가중치 ~144GB→~72GB, util 0.92(=~168GB) → KV 풀 ~96GB로 대폭 확대.
    # A.X-4.0은 max_position_embeddings=131072 네이티브라 rope override 없이 65536 지원.
    # (검증: 사실 배터리 BF16 8/8 동일 + needle 60k토큰 회수 통과. 실기동 런처는
    #  /NHNHOME/nexus/run_vllm_fp8.sh — vLLM 0.24는 --rope-scaling 미지원, --hf-overrides 사용.)
    max_model_len: 65536
    gpu_memory_utilization: 0.92
    port: 8001
    tool_call_parser: "hermes"               # A.X-4.0 모델 카드 기준(조사). 기동 후 검증
    # LoRA는 Phase 3(핫스왑 PoC)에서 활성화. 기본은 비활성.
    enable_lora: false
    max_lora_rank: 64
    max_loras: 4
    lora_modules: {}                         # 예: {tenant-a: /path/to/adapter}

  # -------------------------------------------------------------------------
  # HyperCLOVA X SEED-Think-32B — 네이버, 조건부 상업(MAU<1천만·표기 의무)
  #   텍스트 백본 자체개발. 전용 vLLM 플러그인/chat template가 필요할 수 있다.
  # -------------------------------------------------------------------------
  hyperclova:
    model: "naver-hyperclovax/HyperCLOVAX-SEED-Think-32B"   # HF repo id
    served_model_name: "hyperclova-seed-32b"
    dtype: "bfloat16"
    # 가중치 ~64GB + util 0.90(=162GB) → KV 예산 ~98GB로 여유. 긴 컨텍스트 가능.
    max_model_len: 65536
    gpu_memory_utilization: 0.90
    port: 8001
    # TODO(nexus): HyperCLOVA 전용 tool-call 파서 확인 필요.
    #   hermes로 우선 시도하되, 전용 vLLM 플러그인이 자체 파서를 요구하면 교체한다.
    tool_call_parser: "hermes"
    # TODO(nexus): 전용 vLLM 플러그인 설치가 필요할 수 있음(모델 카드 확인 후 확정).
    extra_args: []
    enable_lora: false
    max_lora_rank: 64
    max_loras: 4
    lora_modules: {}
