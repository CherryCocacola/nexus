# =============================================================================
# Project Nexus — 메인 설정 파일
# 우선순위: CLI 인자 > 환경변수(NEXUS_ 접두사) > 이 파일 > 기본값
# =============================================================================

# GPU 서버 (Machine B) 연결 설정
# Machine A(오케스트레이터)는 GPU를 직접 만지지 않고 아래 OpenAI 호환 API로만 추론한다.
gpu_server:
  url: "http://192.168.21.112:8001"            # vLLM LLM 추론 서버 (Qwen 3.5 27B)
  embedding_url: "http://192.168.21.112:8002"  # e5-large 임베딩 서버 (RAG 벡터화)
  timeout_seconds: 120.0     # 단일 요청 타임아웃 — 27B 장문 생성 여유까지 고려한 값
  max_retries: 10            # with_retry(Tier 4) 최대 재시도 횟수 (콜드/일시장애 흡수)
  retry_base_delay: 0.5      # 지수 백오프 기준 지연(초) — 0.5→1→2…로 증가
  health_check_interval: 30.0  # /health 폴링 주기(초)

# 하드웨어 티어 — 오케스트레이션 모드(Scout 분리/컨텍스트 한계)를 결정한다.
#   왜 "auto"가 아니라 명시하는가:
#   자동 감지(_detect_gpu_vram_gb)는 Machine A 로컬에서 GPU를 조회한다.
#   하지만 2-Machine 토폴로지에서 GPU는 Machine B에만 있어 Machine A에서는
#   항상 조회 실패 → 보수적 TIER_S로 fallback하며 경고 로그를 남긴다.
#   GPU 서버가 RTX 5090(32GB)이므로 결과 자체는 small이 맞다. 경고를 없애고
#   의도를 분명히 하기 위해 명시한다.
#   값: small(RTX 5090 32GB) / medium(H100 80GB) / large(H200·A100 128GB+).
#   → H200/A100 서버로 이전하면 이 값을 medium 또는 large로 변경한다.
hardware_tier: "small"

# Redis (단기 메모리 / 세션 캐시) — docutil-redis 컨테이너 공유
# 비번 주의: docutil-redis 컨테이너의 requirepass가 06-15에 변경됨.
#   (구 docutil_redis_2024 → WRONGPASS 발생). 실제 컨테이너 CMD의 --requirepass 값과 일치시킴.
redis:
  host: "192.168.10.39"
  port: 6340
  db: 6                  # nexus 전용 논리 DB 번호 (다른 앱과 키 충돌 방지용 분리)
  # 비밀번호는 커밋 금지(보안) — 환경변수 NEXUS_REDIS_PASSWORD 로 주입한다.
  #   (docutil-redis 컨테이너의 requirepass 값. 미주입 시 무인증 접속을 시도)
  socket_timeout: 5.0    # 연결/명령 타임아웃(초) — 초과 시 인메모리 폴백으로 강등

# PostgreSQL + pgvector (장기 메모리) — docutil-postgres 컨테이너, nexus DB
postgresql:
  host: "192.168.10.39"
  port: 5440
  database: "nexus"      # tb_memories / tb_knowledge / tb_symbols 가 사는 DB
  user: "nexus"
  # 비밀번호는 커밋 금지(보안) — 환경변수 NEXUS_PG_PASSWORD 로 주입한다.
  #   (미주입 시 빈 문자열 → 원격 DB면 인증 실패로 즉시 드러남 = fail-closed)
  min_connections: 2     # asyncpg 풀 최소 유지 커넥션 (idle 시에도 상시 보유)
  max_connections: 10    # 풀 상한 — 동시 검색·인덱싱 부하를 고려한 보수적 상한

# 모델 설정 — Qwen 3.5 27B Dense AWQ (v7.0 모델 전환)
# Dense 아키텍처 → vLLM LoRA 핫로딩 지원 (학교별/기업별 동적 전환)
# primary_model: vLLM의 served-model-name.
#
# 2026-04-17 Phase 3 적용: nexus-phase1 → nexus-phase3
#   Phase 3의 개선점:
#   1. tokenizer.apply_chat_template으로 tool_calls를 Qwen3.5 공식 XML
#      포맷(<tool_call><function=...><parameter=...>)으로 직렬화 —
#      vLLM qwen3_xml 파서와 호환
#   2. 장문 지식(knowledge_explanation) 카테고리 15% 추가로 긴 설명 능력 회복
#   3. subagent_use_scout 프롬프트 10→30 확대로 탐색 시나리오 다양화
#   학습 결과: train_loss=0.06946 (Phase 1 0.073, Phase 2 0.168 대비 최저)
model:
  primary_model: "nexus-phase3"            # Worker 기본 모델 = vLLM served-model-name
  auxiliary_model: "exaone-7.8b"           # 한국어 보조 모델 (필요 시 사용)
  embedding_model: "multilingual-e5-large"  # RAG 임베딩 모델 (1024차원)
  max_context_tokens: 8192   # 컨텍스트 상한 — RTX 5090(32GB) 실측 제약. 초과 시 압축 발동
  default_temperature: 0.7   # routing 미적용/기본 경로의 샘플링 온도
  default_max_tokens: 4096   # 1회 응답 기본 출력 상한 (라우팅 모드별 값이 우선)

# v7.0 Part 2.5 — 쿼리 라우팅 (2026-04-21)
# Phase 3 LoRA가 도구 호출은 강화했지만 일반 지식 표현을 좁히는 부작용 발생.
# 실측 A/B/C/D에서 베이스 qwen3.5-27b(LoRA OFF)가 인문학/교양 질문에서 우수.
# 질의를 분류하여 KNOWLEDGE_MODE는 베이스 모델, TOOL_MODE는 Phase3 LoRA로 분기.
# TIER_M 이상으로 업그레이드 시 enabled: false로 끄고 단일 경로로 회귀한다.
routing:
  enabled: true               # 질의 분류 활성화 (false면 단일 경로로 회귀)
  long_input_threshold: 500   # 이 글자수 이상이면 TOOL_MODE (문서 첨부 간주)

  # 분류기 종류 — 현재 지원: "heuristic" (기본)
  # 향후 "llm_classifier", "embedding_classifier" 등을 추가할 수 있도록 확장 지점 마련
  classifier_type: "heuristic"

  # 질의 본문에 아래 키워드 중 하나라도 포함되면 TOOL_MODE로 분류.
  # 운영자가 코드 변경 없이 튜닝할 수 있도록 yaml에 명시적으로 나열한다
  # (2026-04-22 리팩토링 4: 외부화). 누락 시 core/config.py의 기본값을 사용.
  tool_keywords:
    # 한국어 — 파일/프로젝트/도구 명시 힌트
    - "파일"
    - "첨부"
    - "업로드"
    - "이 프로젝트"
    - "코드베이스"
    - "디렉토리"
    - "폴더"
    - "리포지토리"
    - "리포지터리"
    - "읽어줘"
    - "읽어 줘"
    - "편집해"
    - "수정해"
    - "모듈 구조"
    - "디렉토리 구조"
    - "프로젝트 구조"
    # 영어
    - "file"
    - "attached"
    - "upload"
    - "this project"
    - "codebase"
    - "repository"
    - "directory"
    - "folder"
    # 도구 이름 — 괄호 포함(함수 호출 스타일)
    - "Read("
    - "Write("
    - "Edit("
    - "Bash("
    - "Glob("
    - "Grep("
    - "Agent("
    - "DocumentProcess"
    # 도구 이름 — 대문자 + 공백 (Read 도구 / Edit the file 등)
    - "Read "
    - "Write "
    - "Edit "
    - "Bash "
    - "Glob "
    - "Grep "
    - "Agent "
    - " LS "
    # 확장자 힌트 (공백 뒤 경로 패턴)
    - ".py "
    - ".md "
    - ".yaml "
    - ".json "
    # 프로젝트 내부 디렉토리 prefix
    - "core/"
    - "web/"
    - "tests/"
    - "training/"
    - "deployment/"
    - "cli/"
    - "config/"
    - "scripts/"
    - "tools/"

  # 단어 경계 매칭 (2026-04-22 리팩토링 6)
  # substring은 "file"이 "filename"에 오탐하는 한계가 있어, 영어 용어는 여기에 등록한다.
  # 비어 있으면 단어 경계 규칙을 적용하지 않는다.
  tool_word_patterns: []

  # 정규식 매칭 — 복잡한 패턴이 필요한 경우에만 사용한다.
  # 유효성은 운영자 책임 (잘못된 regex는 로드 시 경고 후 무시).
  tool_regex_patterns: []

  # CHAT_MODE 분류 임계 (Part 2.5.9, v0.14.6)
  # 입력이 짧고(chat_max_length 이하) 인사 어휘가 들어 있으면 CHAT으로 분류.
  # CHAT은 KB RAG를 주입하지 않는다 — kowiki 100만 청크에서 "안녕"으로
  # 가수 "안녕" 청크가 잡혀 인사에 위키 정보를 붙이는 부작용을 차단.
  chat_max_length: 30
  chat_keywords:
    # 한국어 인사·잡담
    - "안녕"
    - "안뇽"
    - "좋은 아침"
    - "좋은 저녁"
    - "좋은 밤"
    - "굿모닝"
    - "굿나잇"
    - "잘 자"
    - "잘자"
    - "반가워"
    - "반갑습니다"
    - "반갑네"
    - "고마워"
    - "고맙습니다"
    - "감사"
    - "땡큐"
    - "잘 가"
    - "잘가"
    - "다음에 봐"
    - "다음에 보자"
    - "ㅋㅋ"
    - "ㅎㅎ"
    # 영어 인사·잡담
    - "hi"
    - "hello"
    - "hey"
    - "yo"
    - "sup"
    - "good morning"
    - "good evening"
    - "good night"
    - "thanks"
    - "thank you"
    - "thx"
    - "ty"
    - "bye"
    - "goodbye"
    - "see you"
    - "cya"

  # ── 샘플링 파라미터 (degeneration/무한 반복 방지) ──────────────────────
  # 왜 추가했나: top_p/repetition_penalty/frequency_penalty/presence_penalty가
  # vLLM 요청에서 누락되어 동일 문장이 무한 반복되는 결함이 있었다. 클래스별로
  # 차등 적용한다. (TOOL은 repetition_penalty=1.0 비활성 — tool_call JSON/XML의
  # 필수 반복 토큰이 페널티로 손상되어 파싱 실패하는 것을 막기 위함.)
  knowledge_mode:
    model: "qwen3.5-27b"      # 베이스 — LoRA 어댑터 미적용
    temperature: 0.2
    max_tokens: 2048
    enable_thinking: false
    top_p: 0.95               # 꼬리 토큰 약간 차단
    repetition_penalty: 1.15  # 사실형 QA — 반복 가장 강하게 억제
    frequency_penalty: 0.3
    presence_penalty: 0.0
    description: "일반 지식 QA"
  tool_mode:
    model: "nexus-phase3"     # Phase 3 LoRA — 도구 호출 특화
    temperature: 0.3
    max_tokens: 4096
    enable_thinking: false
    top_p: 0.95
    repetition_penalty: 1.0   # 비활성 — tool_call JSON/XML 반복 토큰 보호
    frequency_penalty: 0.0
    presence_penalty: 0.0
    description: "도구 호출 / 프로젝트 작업"
  chat_mode:
    model: "qwen3.5-27b"      # 베이스 — KNOWLEDGE와 동일 모델
    temperature: 0.5
    max_tokens: 512           # 인사·잡담은 짧게
    enable_thinking: false
    top_p: 0.9                # 잡담은 다양성 위해 약간 더 좁힘
    repetition_penalty: 1.1   # 같은 인사말 반복 방지(중간 강도)
    frequency_penalty: 0.2
    presence_penalty: 0.0
    description: "인사·잡담 — RAG 미주입, 짧은 응답"

# 세션 설정
session:
  sessions_dir: ".nexus/sessions"  # JSONL 트랜스크립트 저장 디렉토리
  max_turns: 50               # 세션당 최대 에이전트 턴 수 (폭주 방지 상한)
  max_budget_seconds: 300.0   # 세션 누적 시간 예산(초) — 초과 시 강제 종료
  session_ttl_hours: 24       # 세션 데이터 보존 기간(시간)
  transcript_enabled: true    # CLI 세션 JSONL 영구 기록 on/off

# 보안 설정
security:
  sandbox_enabled: true          # Bash 도구 샌드박스 실행 강제
  sandbox_timeout_seconds: 30.0  # 샌드박스 명령 실행 타임아웃(초)
  max_file_size_bytes: 10485760  # 10MB — 도구가 읽고/쓰는 파일 크기 상한
  # 아래 정규식에 매칭되는 Bash 명령은 Layer 2에서 즉시 차단된다(파괴적 명령 방어).
  bash_deny_patterns:
    - 'rm\s+-rf\s+/'      # 루트/광범위 강제 삭제
    - ':(){ :\|:& };:'    # fork bomb (자기복제 프로세스 폭발)
    - 'dd\s+if=/dev/zero' # 디스크 덮어쓰기
    - 'mkfs\.'            # 파일시스템 포맷
    - '>\s*/dev/sd'       # 블록 디바이스 직접 덮어쓰기

# =============================================================================
# 지식 베이스 RAG 게이팅 — 무관 청크 주입 차단 (2026-06-18)
# 실측: e5-large 코사인 유사도는 무관 문서끼리도 0.78~0.83에 몰린다.
#   - 메타질문 "rag에 이런 정보가 있었어?" → top1 sim=0.824 (무관)
#   - "요한 제바스티안 바흐"                → top1 sim=0.857 (관련)
# 기존 코드 기본값 min_similarity=0.5는 사실상 무필터라 무관 청크가 무조건
# 주입돼 할루시네이션을 유발했다. 절대(abs_threshold)+상대(relevance_margin)
# 2단 게이팅으로 무관 질의는 전부 드롭하고 관련 질의는 핵심 청크만 통과시킨다.
# =============================================================================
knowledge_rag:
  top_k: 5                  # 검색 상위 청크 개수 (컨텍스트 절약 위해 보수적)
  min_similarity: 0.75      # DB 벡터 검색 1차 컷오프 (0.5→0.75 현실화)
  abs_threshold: 0.84       # 최상위조차 이 값 미만이면 전부 드롭 (무관 분포 0.83 상한 바로 위)
  relevance_margin: 0.03    # top_sim에서 이 폭 이내 결과만 유지 (노이즈 청크 절단)

# =============================================================================
# v7.2 MCP(Model Context Protocol) 통합 — LAN 내부 MCP 서버 연결
# 에어갭 fail-closed: 전역/개별 enabled 기본 false. 운영자가 명시 활성해야만 연결.
# base_url은 반드시 LAN 대역(192.168/10/172.16~31/localhost). 비-LAN이면 강등됨.
# trust.read_only: true → 어댑터를 조회 전용으로 완화(쓰기 권한 정책 회피 방지).
#
# 제품 정책(신뢰 경계는 등록 단계에서 통제):
#   초기 제품 정책상 read-only(trust.read_only=true) 서버의 도구만 자동 등록한다.
#   쓰기 가능(read_only=false) 서버는 기본적으로 등록을 건너뛴다(모델이 호출 불가).
#   쓰기 MCP를 켜려면 해당 서버에 allow_write: true 를 명시해야 한다(fail-closed
#   기본 false). 이렇게 명시 등록된 쓰기 도구의 최종 권한 판단은 표준 5계층
#   파이프라인(DEFAULT=ASK / PLAN=DENY / BYPASS=ALLOW)에 일임된다.
# =============================================================================
mcp:
  enabled: false              # 전역 마스터 스위치 (에어갭 fail-closed)
  connect_timeout_sec: 5.0    # 연결/요청 타임아웃 (실패 시 fail-closed)
  servers:
    # ⚠ 포트 8810~8814는 모두 placeholder다 (v7.2 Part 8 미확정). 운영 확정 전까지 임시값.
    - name: "db"
      transport: "http_sse"
      base_url: "http://192.168.10.39:8810"   # 사내 DB MCP (LAN, 포트 placeholder)
      enabled: false
      trust: { read_only: true }
    - name: "diag"
      transport: "http_sse"
      base_url: "http://192.168.21.112:8811"   # 운영 진단 MCP (LAN, 포트 placeholder)
      enabled: false
      trust: { read_only: true }
    - name: "docingest"
      transport: "http_sse"
      base_url: "http://192.168.21.112:8814"   # docingest 문서 MCP (LAN, 포트 placeholder)
      enabled: false
      trust: { read_only: true }
      # docingest는 parse/search(read-only) + ingest(쓰기) 도구를 제공한다.
      # trust.read_only=true이므로 자동 등록 대상이지만, 쓰기 도구(ingest)는
      # allow_write를 명시하지 않는 한 등록에서 제외된다(fail-closed 기본 false).
      # 따라서 기본 상태에서는 parse/search만 Worker에 자동 노출돼 안전하다.
      # ingest까지 쓰려면 아래에 allow_write: true 를 추가해야 한다.
      #   allow_write: true
      # docingest는 자동 RAG(kowiki/KNOWLEDGE 모드)와 중복되지 않으므로
      # expose_to_worker는 기본값 true(미지정)로 두어 Worker 도구 풀에 노출한다.
      # 서버 실행: python -m mcp_servers.run docingest --port 8814
    - name: "kowiki"
      transport: "http_sse"
      base_url: "http://192.168.21.112:8813"   # kowiki RAG MCP (LAN, 포트 placeholder)
      enabled: false
      trust: { read_only: true }
      # kowiki 검색은 KNOWLEDGE 모드 자동 RAG 주입이 담당하므로 Worker 도구로는
      # 중복 노출하지 않음(5090 8K overflow 방지). MCP 서버 자체는 외부 사내 앱
      # 재사용용으로 유지한다(설정에는 남기되 Worker 도구 풀에서만 제외).
      expose_to_worker: false

# =============================================================================
# 컨텍스트 예산 (context budgets) — 하드코딩 외부화 (2026-07-03, B200 Phase 1)
# 여기 적힌 값은 전부 RTX 5090(TIER_S, 8K) 기준 "현행 하드코딩 값"과 동일하다.
# ★이 섹션을 통째로 지워도 코드 기본값(core/config.py ContextBudgetConfig)이
#  똑같은 값으로 동작하므로 무회귀★. B200/H200 티어는 별도 config에서 이 값들을
#  상향 오버라이드한다(현재 파일은 5090 현행값을 명시만 해둔 것).
# =============================================================================
context_budgets:
  # RAG/프롬프트 조립 주입 상한 (출처: prompt_assembler.py)
  turn_state_tokens: 1000        # 이전 턴 요약(TurnState) 주입 상한
  project_rag_tokens: 1500       # 프로젝트 RAG(관련 파일 청크) 주입 상한
  knowledge_rag_tokens: 1000     # 지식베이스(KB) RAG 주입 상한
  # 컨텍스트 압축 예산 (출처: context_manager.py 생성자)
  tool_result_budget: 2048       # 개별 도구 결과 최대 토큰 수(초과분 head+tail 절단)
  preserve_recent_turns: 3       # 압축해도 원본 보존할 최근 턴 수
  preserve_recent_tool_results: 2  # 압축해도 원본 보존할 최근 도구 결과 수
  # 문서 도구 청크 크기 (출처: document_tool.py CHUNK_SIZE)
  document_chunk_size: 2500      # DocumentProcess가 문서를 나눌 청크 글자 수
  # 출력 토큰 에스컬레이션 단계 (출처: query_loop.py OUTPUT_TOKEN_ESCALATION)
  output_token_escalation: [4096, 8192, 16384]  # 응답 잘림 시 출력 한도 점진 상향

# 운영 설정
log_level: "INFO"      # 로그 레벨 (DEBUG/INFO/WARNING/ERROR)
log_file: null         # 파일 로그 경로 — null이면 콘솔(stderr)만 사용
watch_files: false     # 설정 파일 변경 감지 후 핫리로드 여부
debug: false           # 디버그 모드 (상세 추적 활성화)

# 에어갭 모드 (외부 네트워크 차단) — LAN 외 모든 호출을 fail-closed로 거부
air_gap_mode: true

# =============================================================================
# 권한 강제 파이프라인 배선 (감사 Critical #1~3, 2026-07-03)
# =============================================================================
# executor의 유일한 권한 게이트는 지금까지 도구 자체 check_permissions()의 DENY만
# 차단했다(Layer 1/3/4/5 미실행). 아래 스위치로 5계층 파이프라인을 단계적으로 배선한다.
#
# ★무회귀★: enabled=false(기본)면 파이프라인을 호출조차 하지 않아 현행 동작과
#  100% 동일하다. enabled=true 여도 mode="shadow"면 판정을 감사 로그에 기록만 하고
#  실행 경로는 전혀 바꾸지 않는다(차단 안 함 — 관측 전용). 실제 차단은 후속 단계에서
#  mode="enforce"로 전환한다.
permission_enforcement:
  enabled: false     # 기본 false=무회귀(파이프라인 미호출). 검증 시에만 명시 활성.
  mode: "shadow"     # "shadow"=기록만(차단 안 함) | "enforce"=실제 차단(후속 단계)

# =============================================================================
# 감사 로그 (AuditLogger) — 권한 결정을 JSONL로 기록
# =============================================================================
# 파이프라인이 내린 결정(허용/거부/확인)을 한 줄=한 JSON으로 남긴다. 10MB 로테이션.
audit:
  enabled: true              # 감사 기록 on/off (shadow 관측 결과 저장을 위해 기본 on)
  path: "logs/audit.log"     # 로그 파일 경로(상대경로면 작업 디렉토리 기준)

# =============================================================================
# 명령어 필터 (CommandFilter) — 에어갭 설치차단 게이팅
# =============================================================================
# 정책: "에어갭은 배포물에만 적용, 개발 중엔 설치해 진행".
# 개발 환경에서는 pip/npm/apt/yum/brew install을 허용해 개발을 막지 않는다.
# 배포 템플릿(config/examples/nexus_config.b200.yaml)에서는 true로 올려 차단한다.
command_filter:
  block_package_install: false   # 개발: 설치 허용(false). 배포: 차단(true).
