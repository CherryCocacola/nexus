# =============================================================================
# Project Nexus — 메인 설정 파일
# 우선순위: CLI 인자 > 환경변수(NEXUS_ 접두사) > 이 파일 > 기본값
# =============================================================================

# GPU 서버 (Machine B) 연결 설정
gpu_server:
  url: "http://192.168.21.112:8001"
  embedding_url: "http://192.168.21.112:8002"
  timeout_seconds: 120.0
  max_retries: 10
  retry_base_delay: 0.5
  health_check_interval: 30.0

# 하드웨어 티어 — 오케스트레이션 모드(Scout 분리/컨텍스트 한계)를 결정한다.
#   왜 "auto"가 아니라 명시하는가:
#   자동 감지(_detect_gpu_vram_gb)는 Machine A 로컬에서 GPU를 조회한다.
#   하지만 2-Machine 토폴로지에서 GPU는 Machine B에만 있어 Machine A에서는
#   항상 조회 실패 → 보수적 TIER_S로 fallback하며 경고 로그를 남긴다.
#   GPU 서버가 RTX 5090(32GB)이므로 결과 자체는 small이 맞다. 경고를 없애고
#   의도를 분명히 하기 위해 명시한다.
#   값: small(RTX 5090 32GB) / medium(H100 80GB) / large(H200·A100 128GB+).
#   → H200/A100 서버로 이전하면 이 값을 medium 또는 large로 변경한다.
hardware_tier: "small"

