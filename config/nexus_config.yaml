# =============================================================================
# Project Nexus — B200 배포용 설정 템플릿 (standalone)
# =============================================================================
# 이 파일은 무엇인가:
#   NHN/정부 B200(180GB) 단일 컨테이너에서 Nexus를 기동할 때 쓰는 "완전한"
#   설정 템플릿이다. 승인된 B200 플랜 Phase 3 산출물.
#
# 왜 완전한(standalone) 설정인가:
#   설정 로더(core/config.py load_and_validate_config)는 지정된 파일을
#   NexusConfig(**file_data)로 "통째로" 읽는다. base(nexus_config.yaml)와
#   병합하지 않는다. 따라서 이 파일 하나만으로 모든 섹션이 다 있어야 한다
#   (gpu_server/redis/postgresql/model/routing/session/security/knowledge_rag/
#    mcp/context_budgets/web_auth/log_*/air_gap_mode). 아래는 현행 5090용
#   nexus_config.yaml을 복사한 뒤 B200용 값만 오버라이드한 것이다.
#
# 사용법 (둘 중 하나):
#   1) CLI 인자로 지정:  --config config/examples/nexus_config.b200.yaml
#   2) 환경변수로 지정:  NEXUS_CONFIG=config/examples/nexus_config.b200.yaml
#
# 필수 환경변수 (비밀번호/자격증명은 파일에 넣지 않고 주입한다):
#   - NEXUS_PG_PASSWORD      : PostgreSQL 비밀번호 (미주입 시 원격 DB는 인증 실패 = fail-closed)
#   - NEXUS_REDIS_PASSWORD   : Redis requirepass 값 (미주입 시 무인증 접속 시도)
#   - NEXUS_DIAG_GPU_PASS    : (선택) 진단 스크립트가 GPU 노드에 접속할 때만 사용
#
# ★정합성 불변식 (절대 — 어기면 vLLM이 요청을 거부하거나 잘림 발생)★:
#   model.max_context_tokens(입력) + 최대 출력 토큰  ≤  vLLM max_model_len
#   운영 모델 A.X-4.0을 FP8로 서비스하며 창을 65536으로 확대했다(2026-07-05):
#   config/vllm_launch.yaml 의 axmodel.max_model_len = 65536 이므로:
#     입력 49152 + 출력 8192 = 57344 ≤ 65536  (여유 8192)
#   (이전 BF16: 입력 24576 + 출력 8192 = 32768. FP8 전환으로 KV 여유 확보 → 상향.)
#
# ⚠ FP8@65k 근거:
#   FP8(B200 네이티브, near-lossless) 전환으로 가중치 ~144GB→~72GB, KV 풀 대폭 확대.
#   사실질의 배터리 BF16 대비 8/8 동일 + 60k토큰 needle 회수 통과(검증 완료).
#   A.X-4.0 config는 max_position_embeddings=131072 네이티브라 rope override 불필요.
# =============================================================================

# GPU 서버 (Machine B) 연결 설정
# B200은 5090처럼 원격(192.168.21.112)이 아니라, 같은 컨테이너 안에서 localhost로
# co-located 기동된다(vllm_launch.yaml defaults.host = 127.0.0.1). 그래서 URL을
# 원격 LAN 주소가 아니라 컨테이너 내부 루프백(127.0.0.1)으로 지정한다.
gpu_server:
  url: "http://127.0.0.1:8001"            # B200 컨테이너 내부 vLLM 추론 서버(co-located)
  embedding_url: "http://127.0.0.1:8002"  # e5-large 임베딩 서버(같은 컨테이너 내부)
  image_url: "http://127.0.0.1:8003"      # FLUX 이미지 생성 서버(ImageGenerate 도구)
  vision_url: "http://127.0.0.1:8004"     # Gemma 4 12B 비전 서버(AnalyzeImage 도구)
  vision_model: "gemma-4-12b"             # 비전 요청 body의 served-model-name(vLLM --served-model-name과 일치)
  coder_url: "http://127.0.0.1:8005"      # Qwen3-Coder 코딩 서브모델(B200 내부) — Devstral에서 교체(2026-08-20)
  coder_model: "qwen3-coder-30b"          # served-model-name과 일치
  timeout_seconds: 120.0     # 단일 요청 타임아웃 — 장문 생성 여유까지 고려한 값
  max_retries: 10            # with_retry(Tier 4) 최대 재시도 횟수 (콜드/일시장애 흡수)
  retry_base_delay: 0.5      # 지수 백오프 기준 지연(초) — 0.5→1→2…로 증가
  health_check_interval: 30.0  # /health 폴링 주기(초)

# 하드웨어 티어 — 오케스트레이션 모드(Scout 분리/컨텍스트 한계)를 결정한다.
#   5090은 "small"이지만 B200(180GB)은 대용량 GPU이므로 "large"로 명시한다.
#   왜 "auto"가 아닌가: 2-Machine이 아닌 단일 컨테이너라 해도 GPU 자동 감지는
#   환경에 따라 흔들릴 수 있어, 의도를 분명히 하기 위해 명시한다.
#   값: small(RTX 5090 32GB) / medium(H100 80GB) / large(H200·A100·B200 128GB+).
hardware_tier: "large"

# Redis (단기 메모리 / 세션 캐시)
# 비밀번호는 커밋 금지 — 환경변수 NEXUS_REDIS_PASSWORD 로 주입한다.
redis:
  host: "127.0.0.1"
  port: 6340
  db: 6                  # nexus 전용 논리 DB 번호 (다른 앱과 키 충돌 방지용 분리)
  # 비밀번호는 커밋 금지(보안) — 환경변수 NEXUS_REDIS_PASSWORD 로 주입한다.
  #   (미주입 시 무인증 접속을 시도)
  socket_timeout: 5.0    # 연결/명령 타임아웃(초) — 초과 시 인메모리 폴백으로 강등

# PostgreSQL + pgvector (장기 메모리)
# 비밀번호는 커밋 금지 — 환경변수 NEXUS_PG_PASSWORD 로 주입한다.
postgresql:
  host: "127.0.0.1"
  port: 5440
  database: "nexus"      # tb_memories / tb_knowledge / tb_symbols 가 사는 DB
  user: "nexus"
  # 비밀번호는 커밋 금지(보안) — 환경변수 NEXUS_PG_PASSWORD 로 주입한다.
  #   (미주입 시 빈 문자열 → 원격 DB면 인증 실패로 즉시 드러남 = fail-closed)
  min_connections: 2     # asyncpg 풀 최소 유지 커넥션 (idle 시에도 상시 보유)
  max_connections: 10    # 풀 상한 — 동시 검색·인덱싱 부하를 고려한 보수적 상한

# 모델 설정 — 1차 bake-off 모델은 A.X-4.0 72B (SKT, Apache 2.0, Qwen2.5 기반)
# primary_model: vLLM의 served-model-name. vllm_launch.yaml axmodel.served_model_name
#   = "ax-4.0" 과 반드시 일치해야 한다(불일치 시 모델 조회 실패).
#   ※ HyperCLOVA로 bake-off 대상을 바꿀 때는 "hyperclova-seed-32b" 로 교체한다.
model:
  primary_model: "ax-4.0"                  # Worker 기본 모델 = vLLM served-model-name (A.X-4.0)
  auxiliary_model: "exaone-7.8b"           # 한국어 보조 모델 (필요 시 사용)
  embedding_model: "multilingual-e5-large"  # RAG 임베딩 모델 (1024차원)
  # 컨텍스트(입력) 상한. A.X-4.0 FP8 window(65536) = 입력 49152 + 출력 8192 (+여유 8192).
  #   ★불변식: 49152(입력) + 8192(출력, output_token_escalation 최대값) = 57344
  #     ≤ vllm_launch.yaml axmodel.max_model_len(65536). 여유 8192.
  #   (2026-07-05 FP8@65k 검증 통과로 상향: BF16 32768 → FP8 65536. 품질 near-lossless
  #    실증(사실 배터리 8/8 동일), needle 60k토큰 회수 확인. 최대 57344까지 가능하나
  #    안전 여유 위해 49152로 둔다.)
  max_context_tokens: 49152
  default_temperature: 0.7   # routing 미적용/기본 경로의 샘플링 온도
  default_max_tokens: 8192   # 1회 응답 기본 출력 상한 (라우팅 모드별 값이 우선)

# v7.0 Part 2.5 — 쿼리 라우팅
# ★주의: base(nexus_config.yaml)의 "TIER_M 이상 업그레이드 시 enabled:false로 끈다"
#   주석은 부정확하므로 여기서 정정한다.
#   라우팅이 존재하는 진짜 이유는 "컨텍스트 부족"이 아니다. Phase 3 LoRA 어댑터가
#   도구 호출은 강화하지만 일반 지식 표현을 좁히는 부작용이 있어, 지식 질의는 베이스
#   모델로, 도구 질의는 LoRA로 분기하려는 것이다. 이 부작용은 GPU가 B200으로 커져도
#   동일하므로, 대용량 하드웨어라고 해서 라우팅을 끄지 않는다 → enabled: true 유지.
#
#   ※ 단, 1차 bake-off 단계에는 아직 테넌트 LoRA 어댑터가 없다(단일 서브드 모델).
#     그래서 세 모드(knowledge/tool/chat)의 model을 모두 "ax-4.0" 하나로 통일한다.
#     즉 현재 라우팅은 "모델 분기"가 아니라 "샘플링 파라미터/RAG 주입 여부 분기"로만
#     작동한다(KNOWLEDGE/CHAT은 사실형·짧은 응답, TOOL은 도구 호출 안정화, CHAT은
#     KB RAG 미주입). 테넌트 LoRA 도입 시 tool_mode.model 을 해당 어댑터명으로 전환한다.
routing:
  enabled: true               # 질의 분류 활성화 (B200에서도 유지 — 위 주석 참조)
  long_input_threshold: 500   # 이 글자수 이상이면 TOOL_MODE (문서 첨부 간주)

  # 분류기 종류 — 현재 지원: "heuristic" (기본)
  classifier_type: "heuristic"

  # 질의 본문에 아래 키워드 중 하나라도 포함되면 TOOL_MODE로 분류.
  tool_keywords:
    # 한국어 — 파일/프로젝트/도구 명시 힌트
    - "파일"
    - "첨부"
    - "업로드"
    - "이 프로젝트"
    - '코드베이스'
    - "디렉토리"
    - "폴더"
    - "리포지토리"
    - "리포지터리"
    - "읽어줘"
    - "읽어 줘"
    - "편집해"
    - "수정해"
    - "모듈 구조"
    - "디렉토리 구조"
    - "프로젝트 구조"
    # 영어
    - "file"
    - "attached"
    - "upload"
    - "this project"
    - "codebase"
    - "repository"
    - "directory"
    - "folder"
    # 도구 이름 — 괄호 포함(함수 호출 스타일)
    - "Read("
    - "Write("
    - "Edit("
    - "Bash("
    - "Glob("
    - "Grep("
    - "Agent("
    - "DocumentProcess"
    # 도구 이름 — 대문자 + 공백 (Read 도구 / Edit the file 등)
    - "Read "
    - "Write "
    - "Edit "
    - "Bash "
    - "Glob "
    - "Grep "
    - "Agent "
    - " LS "
    # 확장자 힌트 (공백 뒤 경로 패턴)
    - ".py "
    - ".md "
    - ".yaml "
    - ".json "
    # 프로젝트 내부 디렉토리 prefix
    - "core/"
    - "web/"
    - "tests/"
    - "training/"
    - "deployment/"
    - "cli/"
    - "config/"
    - "scripts/"
    - "tools/"

  # 단어 경계 매칭 — 비어 있으면 규칙 미적용.
  tool_word_patterns: []

  # 정규식 매칭 — 복잡한 패턴이 필요한 경우에만 사용.
  # 구현/코딩 요청을 TOOL 로 보낸다 (2026-08-19).
  #
  # 왜 필요했나 (실측):
  #   "대화창 구현해줘" 가 KNOWLEDGE 로 분류됐다. tool_keywords 가 전부 파일·프로젝트
  #   명사(파일/폴더/디렉토리...)라, 파일을 명시하지 않은 구현 요청이 전부 새어
  #   지식 질의로 갔다. 그 결과 셋이 한꺼번에 나빠졌다.
  #     ① 도구를 쓰지 않고 코드를 화면에만 뿌린다(사용자가 복사·붙여넣기해야 함)
  #     ② 사내 문서 RAG 가 불필요하게 주입된다
  #     ③ max_tokens 가 4096 으로 묶인다(TOOL 은 8192) — 긴 코드가 잘린다
  #
  # 오탐 설계:
  #   "구현" 만으로는 걸리지 않게 뒤에 해/하/중/좀 을 요구한다. 그래서
  #   "구현 원리를 설명해줘"·"어떻게 구현되나요" 는 KNOWLEDGE 로 남는다.
  #   "만들/작성" 계열은 코딩 명사(함수·클래스·API·화면·기능...)와 함께 있을 때만
  #   건다. 그래서 "김치는 어떻게 만들어?"·"빵 만드는 법" 은 영향이 없다.
  #   실측: 구현요청 12/12 포착, 지식질의 오탐 0/13.
  tool_regex_patterns:
    - '(구현|개발|리팩터\S*|리팩토\S*|디버깅|디버그)\s*(해|하|중|좀)'
    - '(함수|클래스|모듈|스크립트|컴포넌트|엔드포인트|API|UI|화면|페이지|서버|테스트|기능|창)[^\n]{0,15}?(만들|작성|생성|추가|수정|짜)'
    - '코드\s*\S{0,6}\s*(짜|작성|만들|생성)'

  # CHAT_MODE 분류 임계 (Part 2.5.9)
  chat_max_length: 30
  chat_keywords:
    # 한국어 인사·잡담
    - "안녕"
    - "안뇽"
    - "좋은 아침"
    - "좋은 저녁"
    - "좋은 밤"
    - "굿모닝"
    - "굿나잇"
    - "잘 자"
    - "잘자"
    - "반가워"
    - "반갑습니다"
    - "반갑네"
    - "고마워"
    - "고맙습니다"
    - "감사"
    - "땡큐"
    - "잘 가"
    - "잘가"
    - "다음에 봐"
    - "다음에 보자"
    - "ㅋㅋ"
    - "ㅎㅎ"
    # 영어 인사·잡담
    - "hi"
    - "hello"
    - "hey"
    - "yo"
    - "sup"
    - "good morning"
    - "good evening"
    - "good night"
    - "thanks"
    - "thank you"
    - "thx"
    - "ty"
    - "bye"
    - "goodbye"
    - "see you"
    - "cya"

  # ── 모드별 프로필 (degeneration/무한 반복 방지 + B200 단일 모델) ────────────
  # 1차 bake-off: LoRA 어댑터가 없으므로 model 은 세 모드 모두 "ax-4.0" 로 통일.
  # max_tokens 는 A.X 32768 window(입력 24576)에 맞춰 상향했다.
  knowledge_mode:
    model: "ax-4.0"           # 단일 서브드 모델 (LoRA 어댑터 미적용)
    temperature: 0.2
    max_tokens: 4096          # 사실형 QA — 24K 입력 window에 맞춰 상향(2048→4096)
    enable_thinking: false    # 회귀 이력으로 전부 false 유지
    top_p: 0.95               # 꼬리 토큰 약간 차단
    repetition_penalty: 1.05  # 1.15→1.05 (2026-07-20 degeneration 수정 — 과한 페널티가 긴
                              # 생성에서 종결토큰 억눌러 EOS 붕괴 유발. 실측: 1.05+0.1은 반복0·붕괴0)
    frequency_penalty: 0.1    # 0.3→0.1 (등장횟수 선형비례=긴 생성 붕괴 주범)
    presence_penalty: 0.0
    description: "일반 지식 QA"
  tool_mode:
    model: "ax-4.0"           # 단일 서브드 모델. 테넌트 LoRA 도입 시 어댑터명으로 전환
    temperature: 0.3
    max_tokens: 8192          # 도구 호출/프로젝트 작업 — 8192로 상향(4096→8192)
    enable_thinking: false
    top_p: 0.95
    # 1.0(비활성)→1.05 (2026-08-06 문서 금액 오독 수정 — 근거는 .112.yaml 주석 참조)
    #   자릿수 구분 숫자에서 영(0) 그룹이 하나 더 붙는 현상(150,000,000 → 1,500,000,000)의
    #   유일한 원인이 rep 비활성이었다. 실측: rep 1.0 → 0/5, 1.05 → 4~5/5.
    #   tool_call 무결성은 1.05 에서 확인함(호출 6/6, 경로 리터럴 6/6, 긴 arguments 5/5).
    repetition_penalty: 1.05
    frequency_penalty: 0.15   # runaway degeneration(반복 붕괴) 억제. rep과 달리 프롬프트 토큰
                              # 미포함 + 출현횟수 비례라 tool_call JSON 무결성 지키며 붕괴만 차단
    presence_penalty: 0.0
    description: "도구 호출 / 프로젝트 작업"
  chat_mode:
    model: "ax-4.0"           # KNOWLEDGE와 동일 단일 모델
    temperature: 0.5
    max_tokens: 1024          # 인사·잡담은 짧게(512→1024, 그래도 가장 작게 유지)
    enable_thinking: false
    top_p: 0.9                # 잡담은 다양성 위해 약간 더 좁힘
    repetition_penalty: 1.05  # 1.1→1.05 (2026-07-20 degeneration 안전정렬)
    frequency_penalty: 0.1    # 0.2→0.1
    presence_penalty: 0.0
    description: "인사·잡담 — RAG 미주입, 짧은 응답"

  # ── 자기일관성(Self-Consistency) 사실 검증 (Point 4.3) ────────────────────
  # 기본 비활성(fail-closed). enabled=true로 켜도 3중 게이트(설정·KNOWLEDGE 한정·
  # 사실형 패턴)를 모두 통과해야 발동한다. 켜면 KNOWLEDGE 사실형 짧은답에 한해
  # vLLM n=3 1요청(prefill 공유)으로 3표본을 뽑아 다수결로 답을 확정한다.
  # ★상시 활성 금지★: 출력 3배 + TTFT 10초+(버퍼링)라 평가/데모/고정밀 KB QA에서만 켠다.
  # TODO(nexus, 설계 §4/§7 Phase 6): 아래 latency/토큰 추정치는 미실측.
  #   B200 실서버에서 kowiki 사실형 QA 셋으로 on/off 정확도·지연·토큰을 벤치해
  #   추정치를 실측으로 교체하고 결과를 progress.md에 기록할 것.
  self_consistency:
    enabled: false            # 기본 비활성 (fail-closed 관례 — P6)
    n: 3                      # 표본 수(2=동률, 5=비용 과다 → 3 권장, 허용 2~5)
    temperature: 0.7          # SC 전용 온도(knowledge 0.2로는 표본 다양성 없음)
    top_p: 0.95
    max_tokens: 512           # 표본당 출력 캡 — 비용 분석(§4.1)의 전제
    apply_classes: ["KNOWLEDGE"]   # 적용 질의 클래스(TOOL/CHAT 금지)
    factual_gate: true        # G3 사실형 패턴 게이트 on/off
    factual_max_question_chars: 120
    short_answer_max_chars: 80     # 이 이하면 exact majority, 초과 시 임베딩 클러스터
    min_agreement: 2               # 최소 합의 표(N=3의 과반)
    similarity_threshold: 0.90     # 서술형 임베딩 클러스터 임계(폴백 경로)

# 세션 설정 (base 유지)
session:
  sessions_dir: ".nexus/sessions"  # JSONL 트랜스크립트 저장 디렉토리
  max_turns: 50               # 세션당 최대 에이전트 턴 수 (폭주 방지 상한)
  max_budget_seconds: 300.0   # 세션 누적 시간 예산(초) — 초과 시 강제 종료
  session_ttl_hours: 24       # 세션 데이터 보존 기간(시간)
  transcript_enabled: true    # CLI 세션 JSONL 영구 기록 on/off

# 보안 설정 (base 유지)
security:
  sandbox_enabled: true          # Bash 도구 샌드박스 실행 강제
  sandbox_timeout_seconds: 30.0  # 샌드박스 명령 실행 타임아웃(초)
  max_file_size_bytes: 10485760  # 10MB — 도구가 읽고/쓰는 파일 크기 상한
  # 아래 정규식에 매칭되는 Bash 명령은 Layer 2에서 즉시 차단된다(파괴적 명령 방어).
  bash_deny_patterns:
    - 'rm\s+-rf\s+/'      # 루트/광범위 강제 삭제
    - ':(){ :\|:& };:'    # fork bomb (자기복제 프로세스 폭발)
    - 'dd\s+if=/dev/zero' # 디스크 덮어쓰기
    - 'mkfs\.'            # 파일시스템 포맷
    - '>\s*/dev/sd'       # 블록 디바이스 직접 덮어쓰기

# =============================================================================
# 문서/이미지 생성물(DocumentExport·ImageGenerate) 저장 설정
# =============================================================================
# exports_dir: 생성물 파일이 저장되는 영속 디렉토리. 빈 값이면 {tempdir}/nexus_exports
#   로 폴백하는데, 임시폴더는 재기동/청소 시 소실될 수 있다. 그래서 배포에서는
#   반드시 "영속 경로"로 지정한다(아래 값은 컨테이너 작업 디렉토리 기준 상대경로 —
#   배포 시 절대 영속 경로(예: /data/nexus/exports)로 오버라이드할 것).
# retention_days: 보존 일수. 정리 잡이 만료 생성물(파일+tb_artifacts 메타)을 지운다.
document_export:
  exports_dir: "data/exports"   # 배포 시 절대 영속 경로로 지정할 것
  retention_days: 90            # 생성물 보존기간(정리 잡 기준)

# =============================================================================
# 파일 업로드(웹 /v1/upload) — 크기·형식 상한
# =============================================================================
# 브라우저 UI에도 제한이 있으나 라우트 직접 호출로 우회되므로 실제 방어선은 서버다.
# max_size_bytes 초과 → 413, allowed_extensions 밖 확장자 → 415로 거절한다.
# allowed_extensions 를 비우면 확장자 검사를 하지 않는다(임시 완화용).
upload:
  # 업로드 저장 위치. 빈 값이면 {tempdir}/nexus_uploads 로 폴백한다.
  # ★배포(컨테이너)에서는 반드시 영속 경로로 지정할 것 — 폴백 자리는 /tmp 라
  #   재시작하면 사용자가 올린 파일이 통째로 사라진다(2026-08-08 실측).
  #   exports_dir 과 같은 관례이며, bind mount 안쪽 경로여야 한다.
  uploads_dir: ""                 # 예: /app/data/uploads (호스트 bind mount)
  max_size_bytes: 20971520        # 20MB — 스캔 PDF·발표자료 수용선
  retention_hours: 72             # 업로드 파일 보존 시간(이보다 오래되면 삭제)
                                  # 24→72 (2026-08-12): 대화에서 이미지를 다시
                                  # 물으려면 원본이 남아 있어야 한다. 해시 멱등
                                  # 저장으로 같은 이미지가 겹쳐 쌓이지 않게 되어
                                  # 보존을 늘려도 디스크 부담이 크지 않다.
  cleanup_interval_minutes: 60    # 정리 주기(분). 기동 직후 1회 + 이후 반복. 0이면 정리 끔
  allowed_extensions:
    # 문서 — DocumentProcess 파싱 대상
    - ".pdf"
    - ".docx"
    - ".doc"
    - ".xlsx"
    - ".xls"
    - ".pptx"
    - ".hwpx"
    - ".hwp"
    # 이미지 — AnalyzeImage(비전) / ImageGenerate(img2img) 입력
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".webp"
    - ".bmp"
    # 평문·코드
    - ".txt"
    - ".md"
    - ".csv"
    - ".json"
    - ".yaml"
    - ".yml"
    - ".xml"
    - ".log"
    - ".py"
    - ".js"
    - ".ts"
    - ".html"
    - ".css"
    - ".sql"

# =============================================================================
# 권한 강제 파이프라인 — B200 배포는 실제 차단(enforce)까지 켠다
# =============================================================================
# 배포 환경에서는 5계층 권한 파이프라인을 배선하고 실제 차단까지 활성화한다.
# PathGuard(경로 순회/보호경로/UNC)와 CommandFilter(위험 명령어 + 설치차단)가
# Layer 2 사전검사로 작동한다. (개발 config는 enabled=false 무회귀 상태를 유지)
permission_enforcement:
  enabled: true      # 배포: 파이프라인 배선 활성
  mode: "enforce"    # 배포: deny 판정은 실제로 차단(shadow 아님)

# =============================================================================
# 감사 로그 (AuditLogger) — 권한 결정 JSONL 기록
# =============================================================================
audit:
  enabled: true
  path: "logs/audit.log"

# =============================================================================
# 명령어 필터 (CommandFilter) — 에어갭 설치차단 게이팅
# =============================================================================
# 배포물은 에어갭 준수를 강제한다. pip/npm/apt/yum/brew install을 차단한다.
# (개발 config는 false로 두어 개발 중 라이브러리 설치를 허용한다)
command_filter:
  block_package_install: true    # 배포: 런타임 패키지 설치 차단(에어갭)

# =============================================================================
# 지식 베이스 RAG 게이팅 — 무관 청크 주입 차단 (base 유지)
# =============================================================================
knowledge_rag:
  top_k: 5                  # 검색 상위 청크 개수 (컨텍스트 절약 위해 보수적)
  min_similarity: 0.75      # DB 벡터 검색 1차 컷오프
  abs_threshold: 0.84       # 최상위조차 이 값 미만이면 전부 드롭 (무관 분포 상한 바로 위)
  relevance_margin: 0.03    # top_sim에서 이 폭 이내 결과만 유지 (노이즈 청크 절단)
  ivfflat_probes: 40        # ivfflat 스캔 리스트 수(lists=1000). 기본 1이면 재현율 급락 → 40(≈4%)
  # MMR(Maximal Marginal Relevance) 리랭킹 — 게이팅 통과 survivors 중에서
  # "관련도 높으면서 서로 다른(다양한)" 청크를 골라 컨텍스트 절약 + 커버리지 향상.
  # 게이팅 '이후' 단계라 할루시네이션 저감 로직은 그대로 유지된다.
  mmr:
    enabled: false          # 기본 OFF — 켜기 전 동작 100% 동일(검증 후 활성화)
    fetch_k: 20             # MMR 후보 풀(이 중에서 top_k 다양성 선별)
    lambda: 0.7             # 관련도(λ) vs 다양성(1-λ) 균형, 0.7=관련도 우선
  # 크로스인코더 리랭커 — B200 임베딩 서버 /v1/rerank로 (질의, 각 청크) 관련도를
  # 직접 점수화(0~1)해 재정렬. 캘리브레이션 실측: 관련 0.9~1.0 / 무관 0.0 / 경계 ~0.28
  # → min_score 0.3이 무관·약관련 배제에 적정. ON이면 e5 2단 유사도 게이팅
  # (abs_threshold/relevance_margin)은 rerank 게이팅(min_score)이 대체하고,
  # 엔티티(식별자) 게이팅은 유지된다. MMR과 동시 활성 시 리랭커 우선(MMR 스킵).
  rerank:
    enabled: true           # 활성 — 실서버 e2e 검증 후 켬(광합성 오답 차단·바흐 교정, fail-safe 폴백)
    model: "dragonkue/bge-reranker-v2-m3-ko"  # 서버가 로드하는 리랭커 체크포인트
    fetch_k: 20             # 리랭킹 후보 풀(벡터검색을 넉넉히 가져와 재정렬)
    top_k: 5                # 재정렬·게이팅 후 최종 주입 청크 개수
    min_score: 0.3          # 최고 rerank 점수가 이 값 미만이면 전체 드롭(관련 자료 없음)
    min_similarity: 0.6     # 리랭킹용 벡터검색 1차 컷오프(리콜 그물 완화)
  # 출처 인용(Point 4-2) — 주입 청크에 [출처N] 라벨을 붙이고 모델이 본문에 인용하게
  # 한다. 서버는 검색 메타데이터를 응답 sources 필드로 노출한다(모델 텍스트 아님).
  citation:
    enabled: false          # 기본 OFF — 켜기 전 주입 텍스트·응답 스키마 동작 100% 동일
    label: "출처"           # 라벨 접두어([출처1], [Source1] 등 테넌트별 언어 대응)
    max_sources: 5          # 응답 sources 필드에 노출할 최대 출처 수(주입 top_k 이하)
    expose_in_response: true    # false면 프롬프트 인용만 하고 sources 필드는 비움
    strip_invalid_labels: true  # 주입 범위 밖 번호([출처9] 등)를 응답 텍스트에서 제거

# =============================================================================
# 웹(FastAPI) API 키 인증 — B200 배포 필수
# =============================================================================
# 코드 기본값(WebAuthConfig.enabled)은 무회귀를 위해 False(무인증)이지만,
# 신뢰되지 않은 네트워크에 노출되는 배포 환경에서는 반드시 인증을 켠다.
# 켜지면 web/middleware.py ApiKeyAuthMiddleware가 `Authorization: Bearer <key>`
# 헤더의 API 키를 TenantRegistry.resolve_by_api_key()로 검증한다.
# 테넌트별 api_keys는 config/tenants.yaml에서 관리한다.
# 유효하지 않은 키/누락 시 401로 거부한다(fail-closed).
web_auth:
  enabled: true             # 배포는 인증 필수 (테넌트 api_keys는 config/tenants.yaml)

# =============================================================================
# v7.2 MCP(Model Context Protocol) 통합 — 기본 비활성(에어갭 fail-closed)
# 운영자가 명시적으로 켜기 전까지 연결하지 않는다(base 유지).
# =============================================================================
mcp:
  enabled: false              # 전역 마스터 스위치 (에어갭 fail-closed) — 별도 활성화
  connect_timeout_sec: 5.0    # 연결/요청 타임아웃 (실패 시 fail-closed)
  servers:
    # ⚠ 포트 8810~8814는 모두 placeholder다 (v7.2 Part 8 미확정).
    - name: "db"
      transport: "http_sse"
      base_url: "http://127.0.0.1:8810"   # 사내 DB MCP (LAN, 포트 placeholder)
      enabled: false
      trust: { read_only: true }
    - name: "diag"
      transport: "http_sse"
      base_url: "http://192.168.21.112:8811"   # 운영 진단 MCP (LAN, 포트 placeholder)
      enabled: false
      trust: { read_only: true }
    - name: "docingest"
      transport: "http_sse"
      base_url: "http://192.168.21.112:8814"   # docingest 문서 MCP (LAN, 포트 placeholder)
      enabled: false
      trust: { read_only: true }
      # docingest는 parse/search(read-only) + ingest(쓰기) 도구를 제공한다.
      # trust.read_only=true이므로 자동 등록 대상이지만, 쓰기 도구(ingest)는
      # allow_write를 명시하지 않는 한 등록에서 제외된다(fail-closed 기본 false).
    - name: "kowiki"
      transport: "http_sse"
      base_url: "http://192.168.21.112:8813"   # kowiki RAG MCP (LAN, 포트 placeholder)
      enabled: false
      trust: { read_only: true }
      # kowiki 검색은 KNOWLEDGE 모드 자동 RAG 주입이 담당하므로 Worker 도구로는
      # 중복 노출하지 않음.
      expose_to_worker: false

# =============================================================================
# 컨텍스트 예산 (context budgets) — B200(TIER_large, A.X 24K 입력 window) 상향값
# base(5090, 8K) 대비 각 항목을 상향했다. 합이 입력 window(24576)를 넘지 않도록
# 잡았다. HyperCLOVA(65536)로 확장 시 추가 상향 가능.
# =============================================================================
context_budgets:
  # RAG/프롬프트 조립 주입 상한 (출처: prompt_assembler.py)
  turn_state_tokens: 2000        # 이전 턴 요약(TurnState) 주입 상한 (1000→2000)
  project_rag_tokens: 4000       # 프로젝트 RAG(관련 파일 청크) 주입 상한 (1500→4000)
  knowledge_rag_tokens: 2500     # 지식베이스(KB) RAG 주입 상한 (1000→2500)
  # 컨텍스트 압축 예산 (출처: context_manager.py 생성자)
  tool_result_budget: 8000       # 개별 도구 결과 최대 토큰 수 (2048→8000)
  preserve_recent_turns: 6       # 압축해도 원본 보존할 최근 턴 수 (3→6)
  preserve_recent_tool_results: 3  # 압축해도 원본 보존할 최근 도구 결과 수 (2→3)
  # 문서 도구 청크 크기 (출처: document_tool.py CHUNK_SIZE)
  # 문서 전체 길이가 이 값 이하이면 청크로 쪼개지 않고 1회 호출로 전문 반환(0=비활성).
  # B200 49152 입력창 근거: 오버헤드 제외 시 문서 몫 ~25K토큰 ≈ 한글 40000자. 이 이하
  # 문서는 모델이 청크 재호출·진행 안내 반복 없이 한 번에 읽는다.
  document_singleshot_chars: 40000
  document_chunk_size: 26000     # 통짜 상한 초과 시 분할 청크 글자 수 (8000→26000)
  # 출력 토큰 에스컬레이션 단계 (출처: query_loop.py OUTPUT_TOKEN_ESCALATION)
  #   ★불변식 준수: 최대값 8192 → 입력 24576 + 8192 = 32768 ≤ axmodel max_model_len(32768).
  #   base의 16384 단계는 제거했다(24576+16384=40960 > 32768 이라 불변식 위반).
  output_token_escalation: [4096, 8192]

# =============================================================================
# 구조화 출력 (vLLM guided decoding) — Point 4.1 (2026-07-08)
# 외부 OpenAI 클라이언트(AgentHub 등)의 response_format 수용 및 내부 구조화 생성에
# 사용. 스키마는 항상 요청 단위로 지정한다(전역 스키마 없음).
# =============================================================================
structured_output:
  enabled: true                       # 마스터 스위치. false면 response_format을 400으로 거부
  injection_mode: "response_format"   # vLLM payload 주입 형태:
                                      #   "response_format"    — OpenAI 표준 (권장, 기본)
                                      #   "structured_outputs" — vLLM 신형 확장 (표준형 미지원 시)
                                      # Phase 0 B200 실측 결과 response_format으로 확정(순수 JSON 강제 성공).
  max_schema_bytes: 65536             # 스키마 직렬화 크기 상한 — 초과 시 요청 거부(워치독 충돌 방지)
  strict: true                        # json_schema.strict 기본값

# 운영 설정 (base 유지)
log_level: "INFO"      # 로그 레벨 (DEBUG/INFO/WARNING/ERROR)
log_file: null         # 파일 로그 경로 — null이면 콘솔(stderr)만 사용
watch_files: false     # 설정 파일 변경 감지 후 핫리로드 여부
debug: false           # 디버그 모드 (상세 추적 활성화)

# 에어갭 모드 (외부 네트워크 차단) — LAN/localhost 외 모든 호출을 fail-closed로 거부
air_gap_mode: true
