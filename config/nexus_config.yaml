# 모델 설정 — Qwen 3.5 27B Dense AWQ (v7.0 모델 전환)
# Dense 아키텍처 → vLLM LoRA 핫로딩 지원 (학교별/기업별 동적 전환)
# primary_model: vLLM의 served-model-name.
#
# 2026-04-17 Phase 3 적용: nexus-phase1 → nexus-phase3
#   Phase 3의 개선점:
#   1. tokenizer.apply_chat_template으로 tool_calls를 Qwen3.5 공식 XML
#      포맷(<tool_call><function=...><parameter=...>)으로 직렬화 —
#      vLLM qwen3_xml 파서와 호환
#   2. 장문 지식(knowledge_explanation) 카테고리 15% 추가로 긴 설명 능력 회복
#   3. subagent_use_scout 프롬프트 10→30 확대로 탐색 시나리오 다양화
#   학습 결과: train_loss=0.06946 (Phase 1 0.073, Phase 2 0.168 대비 최저)
model:
  primary_model: "nexus-phase3"
  auxiliary_model: "exaone-7.8b"
  embedding_model: "multilingual-e5-large"
  max_context_tokens: 8192
  default_temperature: 0.7
  default_max_tokens: 4096

# v7.0 Part 2.5 — 쿼리 라우팅 (2026-04-21)
# Phase 3 LoRA가 도구 호출은 강화했지만 일반 지식 표현을 좁히는 부작용 발생.
# 실측 A/B/C/D에서 베이스 qwen3.5-27b(LoRA OFF)가 인문학/교양 질문에서 우수.
# 질의를 분류하여 KNOWLEDGE_MODE는 베이스 모델, TOOL_MODE는 Phase3 LoRA로 분기.
# TIER_M 이상으로 업그레이드 시 enabled: false로 끄고 단일 경로로 회귀한다.
routing:
  enabled: true
  long_input_threshold: 500   # 이 글자수 이상이면 TOOL_MODE (문서 첨부 간주)

  # 분류기 종류 — 현재 지원: "heuristic" (기본)
  # 향후 "llm_classifier", "embedding_classifier" 등을 추가할 수 있도록 확장 지점 마련
  classifier_type: "heuristic"

  # 질의 본문에 아래 키워드 중 하나라도 포함되면 TOOL_MODE로 분류.
  # 운영자가 코드 변경 없이 튜닝할 수 있도록 yaml에 명시적으로 나열한다
  # (2026-04-22 리팩토링 4: 외부화). 누락 시 core/config.py의 기본값을 사용.
  tool_keywords:
    # 한국어 — 파일/프로젝트/도구 명시 힌트
    - "파일"
    - "첨부"
    - "업로드"
    - "이 프로젝트"
    - "코드베이스"
    - "디렉토리"
    - "폴더"
    - "리포지토리"
    - "리포지터리"
    - "읽어줘"
    - "읽어 줘"
    - "편집해"
    - "수정해"
    - "모듈 구조"
    - "디렉토리 구조"
    - "프로젝트 구조"
    # 영어
    - "file"
    - "attached"
    - "upload"
    - "this project"
    - "codebase"
    - "repository"
    - "directory"
    - "folder"
    # 도구 이름 — 괄호 포함(함수 호출 스타일)
    - "Read("
    - "Write("
    - "Edit("
    - "Bash("
    - "Glob("
    - "Grep("
    - "Agent("
    - "DocumentProcess"
    # 도구 이름 — 대문자 + 공백 (Read 도구 / Edit the file 등)
    - "Read "
    - "Write "
    - "Edit "
    - "Bash "
    - "Glob "
    - "Grep "
    - "Agent "
    - " LS "
    # 확장자 힌트 (공백 뒤 경로 패턴)
    - ".py "
    - ".md "
    - ".yaml "
    - ".json "
    # 프로젝트 내부 디렉토리 prefix
    - "core/"
    - "web/"
    - "tests/"
    - "training/"
    - "deployment/"
    - "cli/"
    - "config/"
    - "scripts/"
    - "tools/"

  # 단어 경계 매칭 (2026-04-22 리팩토링 6)
  # substring은 "file"이 "filename"에 오탐하는 한계가 있어, 영어 용어는 여기에 등록한다.
  # 비어 있으면 단어 경계 규칙을 적용하지 않는다.
  tool_word_patterns: []

  # 정규식 매칭 — 복잡한 패턴이 필요한 경우에만 사용한다.
  # 유효성은 운영자 책임 (잘못된 regex는 로드 시 경고 후 무시).
  tool_regex_patterns: []

  # CHAT_MODE 분류 임계 (Part 2.5.9, v0.14.6)
  # 입력이 짧고(chat_max_length 이하) 인사 어휘가 들어 있으면 CHAT으로 분류.
  # CHAT은 KB RAG를 주입하지 않는다 — kowiki 100만 청크에서 "안녕"으로
  # 가수 "안녕" 청크가 잡혀 인사에 위키 정보를 붙이는 부작용을 차단.
  chat_max_length: 30
  chat_keywords:
    # 한국어 인사·잡담
    - "안녕"
    - "안뇽"
    - "좋은 아침"
    - "좋은 저녁"
    - "좋은 밤"
    - "굿모닝"
    - "굿나잇"
    - "잘 자"
    - "잘자"
    - "반가워"
    - "반갑습니다"
    - "반갑네"
    - "고마워"
    - "고맙습니다"
    - "감사"
    - "땡큐"
    - "잘 가"
    - "잘가"
    - "다음에 봐"
    - "다음에 보자"
    - "ㅋㅋ"
    - "ㅎㅎ"
    # 영어 인사·잡담
    - "hi"
    - "hello"
    - "hey"
    - "yo"
    - "sup"
    - "good morning"
    - "good evening"
    - "good night"
    - "thanks"
    - "thank you"
    - "thx"
    - "ty"
    - "bye"
    - "goodbye"
    - "see you"
    - "cya"

  knowledge_mode:
    model: "qwen3.5-27b"      # 베이스 — LoRA 어댑터 미적용
    temperature: 0.2
    max_tokens: 2048
    enable_thinking: false
    description: "일반 지식 QA"
  tool_mode:
    model: "nexus-phase3"     # Phase 3 LoRA — 도구 호출 특화
    temperature: 0.3
    max_tokens: 4096
    enable_thinking: false
    description: "도구 호출 / 프로젝트 작업"
  chat_mode:
    model: "qwen3.5-27b"      # 베이스 — KNOWLEDGE와 동일 모델
    temperature: 0.5
    max_tokens: 512           # 인사·잡담은 짧게
    enable_thinking: false
    description: "인사·잡담 — RAG 미주입, 짧은 응답"

# 세션 설정
session:
  sessions_dir: ".nexus/sessions"
  max_turns: 50
  max_budget_seconds: 300.0
  session_ttl_hours: 24
  transcript_enabled: true

# 보안 설정
security:
  sandbox_enabled: true
  sandbox_timeout_seconds: 30.0
  max_file_size_bytes: 10485760  # 10MB
  bash_deny_patterns:
    - 'rm\s+-rf\s+/'
    - ':(){ :\|:& };:'
    - 'dd\s+if=/dev/zero'
    - 'mkfs\.'
    - '>\s*/dev/sd'

# =============================================================================
# v7.2 MCP(Model Context Protocol) 통합 — LAN 내부 MCP 서버 연결
# 에어갭 fail-closed: 전역/개별 enabled 기본 false. 운영자가 명시 활성해야만 연결.
# base_url은 반드시 LAN 대역(192.168/10/172.16~31/localhost). 비-LAN이면 강등됨.
# trust.read_only: true → 어댑터를 조회 전용으로 완화(쓰기 권한 정책 회피 방지).
#
# 제품 정책(신뢰 경계는 등록 단계에서 통제):
#   초기 제품 정책상 read-only(trust.read_only=true) 서버의 도구만 자동 등록한다.
#   쓰기 가능(read_only=false) 서버는 기본적으로 등록을 건너뛴다(모델이 호출 불가).
#   쓰기 MCP를 켜려면 해당 서버에 allow_write: true 를 명시해야 한다(fail-closed
#   기본 false). 이렇게 명시 등록된 쓰기 도구의 최종 권한 판단은 표준 5계층
#   파이프라인(DEFAULT=ASK / PLAN=DENY / BYPASS=ALLOW)에 일임된다.
# =============================================================================
mcp:
  enabled: false              # 전역 마스터 스위치 (에어갭 fail-closed)
  connect_timeout_sec: 5.0    # 연결/요청 타임아웃 (실패 시 fail-closed)
  servers:
    # ⚠ 포트 8810~8814는 모두 placeholder다 (v7.2 Part 8 미확정). 운영 확정 전까지 임시값.
    - name: "db"
      transport: "http_sse"
      base_url: "http://192.168.10.39:8810"   # 사내 DB MCP (LAN, 포트 placeholder)
      enabled: false
      trust: { read_only: true }
    - name: "diag"
      transport: "http_sse"
      base_url: "http://192.168.21.112:8811"   # 운영 진단 MCP (LAN, 포트 placeholder)
      enabled: false
      trust: { read_only: true }
    - name: "docingest"
      transport: "http_sse"
      base_url: "http://192.168.21.112:8814"   # docingest 문서 MCP (LAN, 포트 placeholder)
      enabled: false
      trust: { read_only: true }
      # docingest는 parse/search(read-only) + ingest(쓰기) 도구를 제공한다.
      # trust.read_only=true이므로 자동 등록 대상이지만, 쓰기 도구(ingest)는
      # allow_write를 명시하지 않는 한 등록에서 제외된다(fail-closed 기본 false).
      # 따라서 기본 상태에서는 parse/search만 Worker에 자동 노출돼 안전하다.
      # ingest까지 쓰려면 아래에 allow_write: true 를 추가해야 한다.
      #   allow_write: true
      # docingest는 자동 RAG(kowiki/KNOWLEDGE 모드)와 중복되지 않으므로
      # expose_to_worker는 기본값 true(미지정)로 두어 Worker 도구 풀에 노출한다.
      # 서버 실행: python -m mcp_servers.run docingest --port 8814
    - name: "kowiki"
      transport: "http_sse"
      base_url: "http://192.168.21.112:8813"   # kowiki RAG MCP (LAN, 포트 placeholder)
      enabled: false
      trust: { read_only: true }
      # kowiki 검색은 KNOWLEDGE 모드 자동 RAG 주입이 담당하므로 Worker 도구로는
      # 중복 노출하지 않음(5090 8K overflow 방지). MCP 서버 자체는 외부 사내 앱
      # 재사용용으로 유지한다(설정에는 남기되 Worker 도구 풀에서만 제외).
      expose_to_worker: false

# 운영 설정
log_level: "INFO"
log_file: null
watch_files: false
debug: false

# 에어갭 모드 (외부 네트워크 차단)
air_gap_mode: true
