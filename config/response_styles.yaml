# 응답 스타일 프리셋 (W1) — 웹·CLI가 함께 읽는 단일 소스.
#
# 왜 코드가 아니라 YAML인가:
#   문구를 다듬는 일은 코드 변경이 아니라 운영 튜닝이다(안티패턴 #4 하드코딩 금지).
#   웹과 CLI가 같은 파일을 읽으므로 표면마다 말투가 갈리는 일이 없다.
#
# 어떻게 쓰이나:
#   core/system_prompt/compose.py 의 compose_system_prompt(style=...) 슬롯에 들어가
#   base 프롬프트 "뒤"에 [응답 스타일] 섹션으로 붙는다. base가 앞이어야 vLLM
#   prefix cache가 적중하기 때문이다.
#
# 주의:
#   - normal은 "스타일 지시 없음"이 기본 동작이다. 빈 문자열이면 섹션 자체가
#     빠져 base만 남는다(= 기존 동작과 100% 동일, 무회귀).
#   - 사용자가 직접 쓴 커스텀 문구는 여기 없고 테넌트 설정에 저장된다.

default: "normal"

styles:
  normal:
    label: "기본"
    description: "특별한 지시 없이 자연스럽게 답합니다."
    # 빈 값 = 섹션 미주입(무회귀 기본값)
    prompt: ""

  concise:
    label: "간결"
    description: "핵심만 짧게. 불릿 위주."
    prompt: |
      답변은 짧고 밀도 있게 한다.
      - 결론을 먼저 말하고, 부연은 꼭 필요한 만큼만 붙인다.
      - 같은 내용을 다른 말로 반복하지 않는다.
      - 목록이 이해에 도움이 되면 불릿을 쓰되, 항목마다 한 줄을 넘기지 않는다.
      - 인사말·사과·자기소개 같은 군더더기 문장은 넣지 않는다.

  explanatory:
    label: "설명형"
    description: "배경과 이유까지 차근히 설명합니다."
    prompt: |
      답변에 "왜 그런지"를 함께 설명한다.
      - 결론뿐 아니라 그렇게 판단한 근거와 배경을 함께 밝힌다.
      - 처음 접하는 사람도 따라올 수 있게 용어를 풀어 쓴다.
      - 도움이 되면 짧은 예시를 하나 든다(장황한 예시는 피한다).
      - 다만 질문 범위를 벗어난 주제로 확장하지 않는다.

  formal:
    label: "격식"
    description: "보고서·공문서 어투로 답합니다."
    prompt: |
      격식 있는 문어체로 답한다.
      - 구어체 표현과 감탄사를 쓰지 않는다.
      - 문장을 완결형으로 끝맺고, 주어와 서술어를 분명히 한다.
      - 보고서에 그대로 옮길 수 있는 수준의 표현을 유지한다.
      - 과장이나 추측은 배제하고 확인된 사실만 서술한다.
